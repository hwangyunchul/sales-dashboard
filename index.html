<!DOCTYPE html>
<html lang="ko" data-palette="graphite" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>황윤철 팀장 영업 관리 대시보드</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23111'/%3E%3Ctext x='16' y='22' font-size='16' text-anchor='middle' fill='%23fff' font-family='sans-serif'%3E%ED%99%A9%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/fonts-archive/Paperlogy/Paperlogy.css">
<style>

:root {
  color-scheme: light;
  --ink-25: #f5f7fa; --ink-0: #ffffff; --ink-50: #f1f4f8; --ink-100: #e7ebf1;
  --ink-200: #dbe1e9; --ink-300: #c2c9d4; --ink-400: #96a0af; --ink-500: #6a7484;
  --ink-600: #4d5665; --ink-700: #39414e; --ink-800: #252b35; --ink-900: #11151c;
  --brand-50: #eef4ff; --brand-100: #dde9ff; --brand-400: #6b9bf0; --brand-500: #3b74e8;
  --brand-600: #2a5ecf; --brand-700: #1f4aa6; --brand-900: #12306e;
  --success-500: #15a34a; --warn-500: #d97706; --danger-500: #dc2626; --info-500: #2b7cd3;
  --viz-1: #3b74e8; --viz-2: #15a34a; --viz-3: #d97706; --viz-4: #7c5cd6; --viz-5: #0ea5a5; --viz-6: #e0559b;
  --r-xs: 4px; --r-sm: 8px; --r-md: 12px; --r-lg: 16px; --r-pill: 999px;
  --shadow-card: 0 1px 2px rgba(16,24,40,.04), 0 6px 18px rgba(16,24,40,.05);
  --shadow-flat: 0 1px 2px rgba(16,24,40,.06);
}
body { background: var(--ink-25); }
/* =========================================================
   황윤철 팀장 영업 대시보드 — design tokens only
   ========================================================= */

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--ink-25);
  color: var(--ink-800);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

html body,
html body * {
  font-family: 'Paperlogy', 'Pretendard', -apple-system, BlinkMacSystemFont,
    'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif !important;
}

body.modal-open { overflow: hidden; }

h1, h2, h3, h4, p { margin: 0; }
ul, ol, dl, dd { margin: 0; padding: 0; list-style: none; }
button { font-size: inherit; }
a { color: inherit; }

.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-500); font-size: 12px; font-weight: 500; }

/* ---------- layout ---------- */
.shell {
  max-width: 1240px;
  margin: 0 auto;
  padding: 20px 20px 80px;
}

/* ---------- top bar ---------- */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
  flex-wrap: wrap;
  padding: 16px 20px;
  background: var(--ink-0);
  border: 1px solid var(--ink-200);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-card);
}

.brand { display: flex; align-items: center; gap: 13px; min-width: 0; }

.brand-mark {
  flex: none;
  width: 46px;
  height: 46px;
  border-radius: 13px;
  display: grid;
  place-items: center;
  font-size: 15px;
  font-weight: 900;
  letter-spacing: -0.5px;
  background: var(--ink-900);
  color: var(--ink-0);
}

.brand-txt h1 {
  font-size: 18.5px;
  font-weight: 800;
  letter-spacing: -0.5px;
  color: var(--ink-900);
  line-height: 1.25;
}

.brand-txt p {
  margin-top: 5px;
  font-size: 12px;
  font-weight: 500;
  color: var(--ink-500);
  display: flex;
  align-items: center;
  gap: 7px;
  flex-wrap: wrap;
}

.mentor {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 8px;
  border-radius: var(--r-pill);
  background: var(--brand-50);
  color: var(--brand-700);
  font-weight: 700;
  font-size: 11.5px;
  border: 1px solid color-mix(in srgb, var(--brand-500) 22%, transparent);
}

.dot-sep {
  width: 3px; height: 3px; border-radius: 50%;
  background: var(--ink-200);
  display: inline-block;
}

.top-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

.goal-chip {
  display: flex;
  flex-direction: column;
  gap: 1px;
  padding: 8px 14px;
  border-radius: var(--r-md);
  background: var(--ink-50);
  border: 1px solid var(--ink-200);
}
.goal-chip .gc-label { font-size: 10.5px; font-weight: 700; color: var(--ink-500); letter-spacing: 0.02em; }
.goal-chip strong { font-size: 15px; font-weight: 800; color: var(--ink-900); letter-spacing: -0.3px; }

.dday {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-width: 108px;
  padding: 8px 16px;
  border-radius: var(--r-md);
  background: var(--ink-900);
  color: var(--ink-0);
}
.dday b { font-size: 24px; font-weight: 900; letter-spacing: -1px; line-height: 1.1; }
.dday span { font-size: 10.5px; opacity: 0.65; margin-top: 2px; letter-spacing: 0.04em; }

/* ---------- tabs ---------- */
.tabbar {
  display: flex;
  gap: 4px;
  margin: 14px 0 18px;
  padding: 5px;
  width: fit-content;
  max-width: 100%;
  overflow-x: auto;
  background: var(--ink-0);
  border: 1px solid var(--ink-200);
  border-radius: var(--r-pill);
  box-shadow: var(--shadow-flat);
}
.tab-btn {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  border: 0;
  background: transparent;
  color: var(--ink-500);
  font-size: 13.5px;
  font-weight: 700;
  padding: 9px 18px;
  border-radius: var(--r-pill);
  cursor: pointer;
  white-space: nowrap;
  transition: background 0.15s, color 0.15s;
}
.tab-btn:hover { background: var(--ink-50); color: var(--ink-900); }
.tab-btn.active { background: var(--ink-900); color: var(--ink-0); }
.tab-btn .tab-count {
  font-size: 11px;
  font-weight: 800;
  padding: 1px 6px;
  border-radius: var(--r-pill);
  background: color-mix(in srgb, var(--ink-500) 16%, transparent);
  color: inherit;
}
.tab-btn.active .tab-count { background: color-mix(in srgb, var(--ink-0) 22%, transparent); }

/* ---------- generic card ---------- */
.card {
  background: var(--ink-0);
  border: 1px solid var(--ink-200);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-card);
}
.card + .card, .card + section, section + .card, section + section { margin-top: 14px; }

.card-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  padding: 16px 18px;
  border-bottom: 1px solid var(--ink-100);
}
.card-title {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 15px;
  font-weight: 800;
  letter-spacing: -0.3px;
  color: var(--ink-900);
}
.card-sub { margin-top: 4px; font-size: 12px; color: var(--ink-500); line-height: 1.45; }
.card-body { padding: 16px 18px; }

.count-pill {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 20px;
  height: 19px;
  padding: 0 6px;
  border-radius: var(--r-pill);
  background: var(--ink-100);
  color: var(--ink-600);
  font-size: 11px;
  font-weight: 800;
}

/* ---------- buttons ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 8px 13px;
  border-radius: var(--r-sm);
  border: 1px solid var(--ink-200);
  background: var(--ink-0);
  color: var(--ink-800);
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  white-space: nowrap;
  transition: background 0.15s, opacity 0.15s, border-color 0.15s;
}
.btn:hover { background: var(--ink-50); }
.btn-primary { background: var(--ink-900); color: var(--ink-0); border-color: var(--ink-900); }
.btn-primary:hover { background: var(--ink-900); opacity: 0.86; }
.btn-danger { color: var(--danger-500); border-color: color-mix(in srgb, var(--danger-500) 35%, transparent); background: transparent; }
.btn-danger:hover { background: color-mix(in srgb, var(--danger-500) 10%, transparent); }
.btn-ghost { border-color: transparent; background: transparent; color: var(--ink-500); }
.btn-ghost:hover { background: var(--ink-50); color: var(--ink-900); }
.btn-sm { padding: 5px 10px; font-size: 12px; }
.btn[disabled] { opacity: 0.5; pointer-events: none; }

.icon-btn {
  display: inline-grid;
  place-items: center;
  width: 30px;
  height: 30px;
  border: 1px solid transparent;
  border-radius: 8px;
  background: transparent;
  color: var(--ink-500);
  font-size: 14px;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
}
.icon-btn:hover { background: var(--ink-50); color: var(--ink-900); }
.icon-btn.tiny { width: 22px; height: 22px; font-size: 11px; }

/* ---------- inputs ---------- */
.input, .select, .textarea {
  width: 100%;
  min-width: 0;
  padding: 9px 11px;
  border: 1px solid var(--ink-200);
  border-radius: var(--r-sm);
  background: var(--ink-0);
  color: var(--ink-900);
  font-size: 13.5px;
  line-height: 1.3;
  outline: none;
  transition: border-color 0.15s, box-shadow 0.15s;
}
.input::placeholder, .textarea::placeholder { color: var(--ink-400); }
.input:focus, .select:focus, .textarea:focus {
  border-color: var(--brand-500);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand-500) 16%, transparent);
}
.select { cursor: pointer; }
.textarea { resize: vertical; min-height: 74px; line-height: 1.6; }

.inline-form { display: flex; gap: 7px; align-items: center; flex-wrap: wrap; }
.inline-form .input { flex: 1 1 140px; }
.inline-form .select { flex: 0 0 auto; width: auto; min-width: 96px; }
.inline-form input[type="date"] { flex: 0 0 auto; width: 142px; }

/* ---------- hero ---------- */
.hero {
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 22px;
  flex-wrap: wrap;
  padding: 24px 26px;
  border-radius: calc(var(--r-lg) + 2px);
  border: 1px solid color-mix(in srgb, var(--brand-500) 26%, var(--ink-200));
  background:
    radial-gradient(120% 180% at 100% 0%, color-mix(in srgb, var(--brand-500) 15%, transparent), transparent 62%),
    var(--ink-0);
  box-shadow: var(--shadow-card);
}
.hero::after {
  content: "";
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 4px;
  background: var(--brand-500);
}
.hero-eyebrow {
  font-size: 10.5px;
  font-weight: 800;
  letter-spacing: 0.13em;
  color: var(--brand-600);
}
.hero-title {
  margin-top: 7px;
  font-size: 27px;
  font-weight: 900;
  letter-spacing: -0.9px;
  color: var(--ink-900);
  line-height: 1.18;
}
.hero-title em {
  font-style: normal;
  color: var(--brand-600);
}
.hero-sub {
  margin-top: 8px;
  font-size: 13px;
  color: var(--ink-500);
  font-weight: 500;
}
.hero-pills { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; }
.hero-pill {
  padding: 4px 10px;
  border-radius: var(--r-pill);
  background: var(--ink-50);
  border: 1px solid var(--ink-200);
  color: var(--ink-700);
  font-size: 11.5px;
  font-weight: 700;
}
.hero-pill strong { color: var(--ink-900); }

/* ---------- perf / gauges ---------- */
.perf-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  flex-wrap: wrap;
  padding: 16px 18px 4px;
}
.formula {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 7px 13px;
  border-radius: var(--r-pill);
  background: var(--ink-50);
  border: 1px solid var(--ink-200);
  font-size: 12px;
  font-weight: 700;
  color: var(--ink-600);
}
.formula b { color: var(--brand-600); font-weight: 900; }
.formula .f-eq { color: var(--ink-300); font-weight: 700; }

.gauges {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 0;
  padding: 8px 6px 6px;
}
.gauge { padding: 10px 12px; border-left: 1px solid var(--ink-100); }
.gauge:first-child { border-left: 0; }
.gauge-top { display: flex; align-items: baseline; justify-content: space-between; gap: 6px; }
.gauge-label { font-size: 12px; font-weight: 700; color: var(--ink-500); }
.gauge-val { font-size: 19px; font-weight: 900; letter-spacing: -0.6px; color: var(--ink-900); white-space: nowrap; }
.gauge-val .unit { font-size: 11.5px; font-weight: 600; color: var(--ink-400); margin-left: 3px; letter-spacing: 0; }
.gauge-sub { margin-top: 6px; font-size: 11px; color: var(--ink-500); }

.bar { height: 7px; border-radius: 99px; background: var(--ink-100); overflow: hidden; margin-top: 9px; }
.bar.sm { height: 6px; margin-top: 0; }
.bar > i {
  display: block;
  height: 100%;
  border-radius: 99px;
  background: var(--brand-500);
  transition: width 0.45s ease;
}
.bar > i.ok { background: var(--success-500); }
.bar > i.warn { background: var(--warn-500); }
.bar > i.ink { background: var(--ink-400); }

/* ---------- calendar ---------- */
.seg {
  display: inline-flex;
  padding: 3px;
  gap: 2px;
  border-radius: var(--r-pill);
  background: var(--ink-50);
  border: 1px solid var(--ink-200);
}
.seg-btn {
  border: 0;
  background: transparent;
  color: var(--ink-500);
  font-size: 12px;
  font-weight: 700;
  padding: 6px 12px;
  border-radius: var(--r-pill);
  cursor: pointer;
  white-space: nowrap;
}
.seg-btn.active { background: var(--ink-0); color: var(--ink-900); box-shadow: var(--shadow-flat); }

.cal-legend {
  display: flex;
  gap: 14px;
  flex-wrap: wrap;
  padding: 10px 18px 0;
  font-size: 11px;
  color: var(--ink-500);
  font-weight: 600;
}
.cal-legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }

.cal-wrap { padding: 10px 14px 16px; }
.cal-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
}
.month {
  border: 1px solid var(--ink-200);
  border-radius: var(--r-md);
  padding: 10px 9px 8px;
  background: var(--ink-0);
}
.month-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 4px 7px;
  font-size: 12.5px;
  font-weight: 800;
  color: var(--ink-900);
  letter-spacing: -0.2px;
}
.month-count {
  font-size: 10.5px;
  font-weight: 700;
  color: var(--ink-500);
  background: var(--ink-50);
  border-radius: var(--r-pill);
  padding: 1px 6px;
}
.month-count.zero { visibility: hidden; }
.dow { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; margin-bottom: 3px; }
.dow span {
  text-align: center;
  font-size: 10px;
  font-weight: 700;
  color: var(--ink-400);
  padding: 2px 0;
}
.dow span.sun { color: var(--danger-500); }
.dow span.sat { color: var(--brand-500); }

.days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
.day {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  min-height: 37px;
  padding: 3px 1px;
  border: 1px solid transparent;
  border-radius: 7px;
  background: transparent;
  color: var(--ink-700);
  font-size: 11.5px;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.12s;
}
.day:hover { background: var(--ink-50); border-color: var(--ink-200); }
.day .dnum { line-height: 1; }
.day.sun .dnum { color: var(--danger-500); }
.day.sat .dnum { color: var(--brand-500); }
.day.out { visibility: hidden; pointer-events: none; }
.day.today { background: var(--ink-900); }
.day.today .dnum { color: var(--ink-0); font-weight: 800; }
.day.today:hover { background: var(--ink-900); }
.dots { display: flex; gap: 2.5px; height: 4px; align-items: center; }
.dots i { width: 4px; height: 4px; border-radius: 50%; display: block; }
.d-meet { background: var(--brand-500); }
.d-call { background: var(--success-500); }
.d-todo { background: var(--warn-500); }
.d-log { background: var(--ink-300); }
.day.today .d-log { background: var(--ink-400); }

/* ---------- split panels ---------- */
.split {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  align-items: start;
  gap: 14px;
  margin-top: 14px;
}
.split > .card { margin-top: 0; }
.split + .card { margin-top: 14px; }

/* ---------- todo list ---------- */
.todo-list { display: flex; flex-direction: column; }
.todo {
  display: flex;
  align-items: flex-start;
  gap: 9px;
  padding: 9px 2px;
  border-bottom: 1px solid var(--ink-100);
}
.todo:last-child { border-bottom: 0; }
.todo input[type="checkbox"] {
  flex: none;
  width: 16px;
  height: 16px;
  margin-top: 1px;
  accent-color: var(--brand-500);
  cursor: pointer;
}
.todo .kdot {
  flex: none;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  margin-top: 7px;
}
.todo .kdot.미팅 { background: var(--brand-500); }
.todo .kdot.전화 { background: var(--success-500); }
.todo .kdot.이슈체크 { background: var(--warn-500); }
.todo .kdot.기타 { background: var(--ink-300); }
.todo .txt { flex: 1; font-size: 13.5px; line-height: 1.5; color: var(--ink-800); word-break: break-word; }
.todo.done .txt { color: var(--ink-400); text-decoration: line-through; }
.todo .ktag {
  flex: none;
  font-size: 10px;
  font-weight: 700;
  color: var(--ink-500);
  background: var(--ink-50);
  border-radius: var(--r-pill);
  padding: 2px 7px;
  margin-top: 1px;
}
.todo .icon-btn { margin: -4px -2px 0 0; opacity: 0.5; transition: opacity 0.15s; }
.todo:hover .icon-btn { opacity: 1; }

/* ---------- monthly issues ---------- */
.mpills {
  display: flex;
  gap: 4px;
  overflow-x: auto;
  padding-bottom: 2px;
  margin-bottom: 10px;
}
.mpill {
  border: 1px solid var(--ink-200);
  background: var(--ink-0);
  color: var(--ink-500);
  font-size: 11.5px;
  font-weight: 700;
  padding: 5px 11px;
  border-radius: var(--r-pill);
  cursor: pointer;
  white-space: nowrap;
}
.mpill.active { background: var(--ink-900); color: var(--ink-0); border-color: var(--ink-900); }
.missue { display: flex; align-items: center; gap: 9px; padding: 9px 2px; border-bottom: 1px solid var(--ink-100); }
.missue:last-child { border-bottom: 0; }
.missue .mtxt { flex: 1; font-size: 13.5px; color: var(--ink-800); }
.missue.done .mtxt { color: var(--ink-400); text-decoration: line-through; }
.missue .icon-btn { opacity: 0.5; }
.missue:hover .icon-btn { opacity: 1; }
.missue .mi-check {
  width: 18px; height: 18px; border-radius: 50%;
  border: 1.5px solid var(--ink-200);
  background: transparent;
  display: grid; place-items: center;
  font-size: 10px; color: transparent; cursor: pointer; flex: none;
}
.missue.done .mi-check { background: var(--brand-500); border-color: var(--brand-500); color: var(--ink-0); }

.add-row { display: flex; gap: 7px; margin-top: 10px; }
.add-row .input { flex: 1; }
.add-plus {
  flex: none;
  width: 38px;
  height: 38px;
  border-radius: var(--r-sm);
  border: 1px dashed color-mix(in srgb, var(--brand-500) 45%, var(--ink-200));
  background: var(--brand-50);
  color: var(--brand-700);
  font-size: 19px;
  font-weight: 700;
  line-height: 1;
  cursor: pointer;
  display: grid;
  place-items: center;
}
.add-plus:hover { background: color-mix(in srgb, var(--brand-500) 16%, transparent); }

/* ---------- tables ---------- */
.table-wrap { width: 100%; overflow-x: auto; }
.table-wrap:has(> table > tbody > tr > td[colspan]) { overflow-x: visible; }
.table-wrap:has(> table > tbody > tr > td[colspan]) > table { min-width: 0; width: 100%; }
.table-wrap:has(> table > tbody > tr > td[colspan]) > table > thead { display: none; }
.scroll-hint { display: none; font-size: 12px; color: var(--ink-500); margin: 0 0 6px 2px; }

/* ---------- resource upload / viewer ---------- */
.up-row { display: flex; gap: 10px; align-items: stretch; flex-wrap: wrap; }
.up-row .input { flex: 0 0 220px; }
.up-drop {
  flex: 1 1 320px; min-height: 64px; display: flex; align-items: center; gap: 12px;
  padding: 12px 16px; border: 1.5px dashed var(--ink-300); border-radius: var(--r-md);
  background: var(--ink-25); cursor: pointer; transition: border-color .15s, background .15s;
}
.up-drop:hover, .up-drop.dragging { border-color: var(--brand-500); background: var(--brand-50); }
.up-drop input[type=file] { display: none; }
.up-plus {
  width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  background: var(--ink-900); color: var(--ink-0); font-size: 18px; font-weight: 700; flex: 0 0 auto;
}
.up-txt { display: flex; flex-direction: column; gap: 2px; font-size: 13px; color: var(--ink-600); }
.up-txt b { color: var(--ink-900); font-weight: 700; }
.up-sub { font-size: 12px; color: var(--ink-400); }
.up-status { margin-top: 12px; display: flex; flex-direction: column; gap: 7px; }
.up-item { display: grid; grid-template-columns: 1fr auto; gap: 3px 10px; font-size: 12px; color: var(--ink-600); }
.up-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.up-pct { color: var(--ink-400); }
.up-bar { grid-column: 1 / -1; height: 4px; border-radius: var(--r-pill); background: var(--ink-100); overflow: hidden; }
.up-bar i { display: block; height: 100%; width: 0; background: var(--brand-500); transition: width .2s; }
.up-item.done .up-pct { color: var(--success-500); }
.up-item.done .up-bar i { background: var(--success-500); }
.up-item.fail .up-pct { color: var(--danger-500); }
.up-item.fail .up-bar i { background: var(--danger-500); }
.file-list { margin-top: 14px; display: flex; flex-direction: column; border-top: 1px solid var(--ink-100); }
.file-row { display: flex; align-items: center; gap: 12px; padding: 12px 2px; border-bottom: 1px solid var(--ink-100); }
.f-ico {
  flex: 0 0 auto; width: 40px; height: 40px; border-radius: 10px; display: flex;
  align-items: center; justify-content: center; font-size: 10px; font-weight: 800;
  letter-spacing: .3px; background: var(--ink-50); color: var(--ink-500);
}
.fx-pdf { color: var(--danger-500); }
.fx-img { color: var(--viz-4); }
.fx-doc { color: var(--brand-600); }
.fx-sheet { color: var(--success-500); }
.fx-ppt { color: var(--warn-500); }
.fx-text { color: var(--ink-500); }
.f-main { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.f-title {
  background: none; border: 0; padding: 0; text-align: left; font: inherit;
  font-weight: 700; color: var(--ink-900); cursor: pointer; line-height: 1.35;
}
.f-title:hover { color: var(--brand-600); text-decoration: underline; }
.f-meta { font-size: 12px; color: var(--ink-500); }
.f-note { font-size: 12px; color: var(--ink-400); }
.f-actions { margin-left: auto; display: flex; gap: 6px; align-items: center; flex: 0 0 auto; }
.f-actions .btn-sm { padding: 5px 10px; font-size: 12px; }
.file-empty { padding: 22px 4px; text-align: center; color: var(--ink-400); font-size: 13px; }
.rv-wrap { border: 1px solid var(--ink-100); border-radius: var(--r-md); overflow: hidden; background: var(--ink-50); }
.rv-img { display: block; width: 100%; height: auto; max-height: 70vh; object-fit: contain; background: var(--ink-0); }
.rv-frame { display: block; width: 100%; height: 70vh; border: 0; background: var(--ink-0); }
.rv-text {
  margin: 0; padding: 16px; max-height: 70vh; overflow: auto; background: var(--ink-25);
  border: 1px solid var(--ink-100); border-radius: var(--r-md);
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 12.5px; line-height: 1.65; white-space: pre-wrap;
}
.rv-noview { padding: 34px 18px; text-align: center; color: var(--ink-500); font-size: 13px; line-height: 1.7; }
.rv-noview .f-ico { margin: 0 auto 14px; width: 54px; height: 54px; font-size: 11px; }
.rv-note {
  margin: 0 0 12px; font-size: 13px; color: var(--ink-600); background: var(--ink-25);
  border-left: 3px solid var(--brand-400); padding: 8px 12px;
  border-radius: 0 var(--r-sm) var(--r-sm) 0;
}
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th {
  text-align: left;
  padding: 9px 12px;
  background: var(--ink-25);
  border-bottom: 1px solid var(--ink-200);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.03em;
  color: var(--ink-500);
  white-space: nowrap;
}
.tbl th.r, .tbl td.r { text-align: right; }
.tbl td {
  padding: 11px 12px;
  border-bottom: 1px solid var(--ink-100);
  vertical-align: middle;
  color: var(--ink-800);
}
.tbl tbody tr:last-child td { border-bottom: 0; }
.tbl tbody tr.rowlink { cursor: pointer; }
.tbl tbody tr.rowlink:hover { background: var(--ink-25); }
.tbl-co { min-width: 900px; }
.tbl-prog { min-width: 640px; }

.co-name { font-size: 13.5px; font-weight: 700; color: var(--ink-900); letter-spacing: -0.2px; }
.co-sub { font-size: 11.5px; color: var(--ink-500); margin-top: 2px; }
.tbl .money { font-weight: 700; color: var(--ink-900); white-space: nowrap; }
.tbl .money.zero { color: var(--ink-400); font-weight: 500; }

.prog-cell { display: flex; align-items: center; gap: 8px; min-width: 108px; }
.prog-cell .bar { flex: 1; margin-top: 0; }
.prog-cell b { font-size: 11.5px; color: var(--ink-700); width: 30px; text-align: right; }

/* ---------- chips & badges ---------- */
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 7px 2px 12px;
  border-radius: 6px;
  font-size: 11px;
  font-weight: 700;
  color: var(--ink-700);
  background: var(--ink-50);
  border: 1px solid var(--ink-200);
  white-space: nowrap;
  line-height: 1.5;
}
.chip::before {
  content: "";
  position: absolute;
  left: 5px;
  top: 50%;
  transform: translateY(-50%);
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--ink-400);
}
.chip.more { padding-left: 7px; color: var(--ink-500); }
.chip.more::before { display: none; }

.chip.cert { background: color-mix(in srgb, var(--brand-500) 11%, var(--ink-0)); border-color: color-mix(in srgb, var(--brand-500) 24%, transparent); }
.chip.cert::before { background: var(--brand-500); }
.chip.fund { background: color-mix(in srgb, var(--success-500) 11%, var(--ink-0)); border-color: color-mix(in srgb, var(--success-500) 24%, transparent); }
.chip.fund::before { background: var(--success-500); }
.chip.tax { background: color-mix(in srgb, var(--warn-500) 13%, var(--ink-0)); border-color: color-mix(in srgb, var(--warn-500) 26%, transparent); }
.chip.tax::before { background: var(--warn-500); }
.chip.inherit { background: color-mix(in srgb, var(--viz-4) 11%, var(--ink-0)); border-color: color-mix(in srgb, var(--viz-4) 24%, transparent); }
.chip.inherit::before { background: var(--viz-4); }
.chip.consult { background: color-mix(in srgb, var(--viz-6) 11%, var(--ink-0)); border-color: color-mix(in srgb, var(--viz-6) 24%, transparent); }
.chip.consult::before { background: var(--viz-6); }
.chip.etc::before { background: var(--ink-400); }

.badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 9px;
  border-radius: var(--r-pill);
  font-size: 11px;
  font-weight: 800;
  white-space: nowrap;
  border: 1px solid transparent;
}
.badge::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
.st-new { background: color-mix(in srgb, var(--ink-400) 13%, transparent); color: var(--ink-600); }
.st-active { background: color-mix(in srgb, var(--brand-500) 13%, transparent); color: var(--brand-700); }
.st-done { background: color-mix(in srgb, var(--success-500) 15%, transparent); color: color-mix(in srgb, var(--success-500) 82%, var(--ink-900)); }
.st-hold { background: color-mix(in srgb, var(--warn-500) 15%, transparent); color: color-mix(in srgb, var(--warn-500) 78%, var(--ink-900)); }

/* ---------- toolbar (company list) ---------- */
.toolbar {
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
  padding: 12px 18px;
  border-bottom: 1px solid var(--ink-100);
  background: var(--ink-25);
}
.search { position: relative; flex: 1 1 220px; min-width: 0; }
.search .input { padding-left: 32px; }
.search::before {
  content: "";
  position: absolute;
  left: 12px;
  top: 50%;
  width: 11px;
  height: 11px;
  margin-top: -7px;
  border: 2px solid var(--ink-400);
  border-radius: 50%;
  pointer-events: none;
}
.search::after {
  content: "";
  position: absolute;
  left: 21px;
  top: 50%;
  width: 6px;
  height: 2px;
  margin-top: 3px;
  background: var(--ink-400);
  transform: rotate(45deg);
  border-radius: 2px;
  pointer-events: none;
}
.toolbar .select { width: auto; min-width: 104px; flex: 0 0 auto; }

/* ---------- empty state ---------- */
.empty {
  padding: 34px 20px;
  text-align: center;
  color: var(--ink-500);
}
.empty .em-title { font-size: 14px; font-weight: 800; color: var(--ink-800); margin-bottom: 5px; }
.empty .em-sub { font-size: 12.5px; line-height: 1.6; margin-bottom: 14px; }
.empty .em-icon {
  width: 42px; height: 42px; margin: 0 auto 10px;
  border-radius: 12px;
  background: var(--ink-50);
  border: 1px solid var(--ink-200);
  display: grid; place-items: center;
  font-size: 18px;
  color: var(--ink-400);
}

/* ---------- modal ---------- */
.modal-backdrop {
  position: fixed;
  inset: 0;
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 18px;
  background: rgba(12, 14, 18, 0.48);
  backdrop-filter: blur(2px);
  animation: fade 0.16s ease-out;
}
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes rise { from { opacity: 0; transform: translateY(10px) scale(0.99); } to { opacity: 1; transform: none; } }
.modal {
  display: flex;
  flex-direction: column;
  width: 100%;
  max-width: 580px;
  max-height: 92vh;
  background: var(--ink-0);
  border: 1px solid var(--ink-200);
  border-radius: calc(var(--r-lg) + 2px);
  box-shadow: 0 24px 64px rgba(0, 0, 0, 0.3);
  overflow: hidden;
  animation: rise 0.2s ease-out;
}
.modal.modal-wide { max-width: 860px; }
.modal.modal-file { max-width: 1040px; }
.modal-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  padding: 15px 18px;
  border-bottom: 1px solid var(--ink-100);
}
.modal-title { font-size: 16px; font-weight: 800; letter-spacing: -0.3px; color: var(--ink-900); }
.modal-sub { margin-top: 3px; font-size: 11.5px; color: var(--ink-500); }
.modal-body { padding: 16px 18px; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; }
.modal-foot {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 12px 18px;
  border-top: 1px solid var(--ink-100);
  background: var(--ink-25);
}
.modal-foot .spacer { flex: 1; }

/* ---------- forms ---------- */
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 13px; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field.full { grid-column: 1 / -1; }
.field > label { font-size: 11.5px; font-weight: 700; color: var(--ink-600); letter-spacing: 0.01em; }
.field .hint { font-weight: 500; color: var(--ink-400); font-size: 11px; margin-left: 4px; }
.req { color: var(--danger-500); }

.issue-groups { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.issue-group {
  border: 1px solid var(--ink-200);
  border-radius: var(--r-sm);
  padding: 9px 10px;
  background: var(--ink-25);
}
.ig-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 7px; }
.ig-amt { font-size: 10.5px; font-weight: 700; color: var(--ink-500); }
.ig-chips { display: flex; flex-wrap: wrap; gap: 5px; }
.pick {
  border: 1px solid var(--ink-200);
  background: var(--ink-0);
  color: var(--ink-600);
  border-radius: var(--r-pill);
  padding: 5px 11px;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.12s;
}
.pick:hover { border-color: var(--brand-500); color: var(--ink-900); }
.pick.on {
  background: var(--ink-900);
  border-color: var(--ink-900);
  color: var(--ink-0);
}
.pick.on::before { content: "✓ "; font-size: 10px; opacity: 0.9; }

.amount-box {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-top: 10px;
  padding: 11px 14px;
  border-radius: var(--r-md);
  background: var(--brand-50);
  border: 1px solid color-mix(in srgb, var(--brand-500) 25%, transparent);
}
.ab-label { display: block; font-size: 11px; font-weight: 800; color: var(--brand-700); letter-spacing: 0.02em; }
.ab-count { display: block; font-size: 10.5px; color: var(--ink-500); margin-top: 2px; }
.amount-box strong { font-size: 21px; font-weight: 900; letter-spacing: -0.7px; color: var(--brand-700); }

/* ---------- company detail ---------- */
.detail-top {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 14px;
}
.dt-box {
  padding: 13px 15px;
  border-radius: var(--r-md);
  border: 1px solid var(--ink-200);
  background: var(--ink-25);
}
.dt-box.amount { background: var(--brand-50); border-color: color-mix(in srgb, var(--brand-500) 25%, transparent); }
.dt-box .dt-label { font-size: 10.5px; font-weight: 800; color: var(--ink-500); letter-spacing: 0.03em; }
.dt-box .dt-value { margin-top: 4px; font-size: 22px; font-weight: 900; letter-spacing: -0.8px; color: var(--ink-900); }
.dt-box.amount .dt-value { color: var(--brand-700); }
.dt-box .dt-sub { margin-top: 5px; font-size: 11px; color: var(--ink-500); }
.dt-prog-head { display: flex; justify-content: space-between; font-size: 11px; font-weight: 700; color: var(--ink-500); }
.dt-prog-head strong { color: var(--ink-900); font-size: 13px; }

.dl { display: grid; grid-template-columns: 1fr 1fr; gap: 0; border-top: 1px solid var(--ink-100); }
.dl > div { display: flex; gap: 10px; padding: 9px 2px; border-bottom: 1px solid var(--ink-100); min-width: 0; }
.dl dt { flex: none; width: 64px; font-size: 11.5px; color: var(--ink-500); font-weight: 600; }
.dl dd { flex: 1; font-size: 12.5px; color: var(--ink-800); word-break: break-all; }

.mini-title {
  display: flex;
  align-items: center;
  gap: 7px;
  margin: 18px 0 9px;
  font-size: 12.5px;
  font-weight: 800;
  color: var(--ink-900);
}
.mini-title:first-child { margin-top: 0; }

.mini-list { display: flex; flex-direction: column; margin-top: 8px; }
.mini-item {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  padding: 8px 2px;
  border-bottom: 1px solid var(--ink-100);
  font-size: 12.5px;
}
.mini-item:last-child { border-bottom: 0; }
.mini-item .mi-type {
  flex: none;
  font-size: 10px;
  font-weight: 800;
  padding: 2px 6px;
  border-radius: 5px;
  margin-top: 1px;
}
.mi-type.meeting { background: color-mix(in srgb, var(--brand-500) 14%, transparent); color: var(--brand-700); }
.mi-type.call { background: color-mix(in srgb, var(--success-500) 16%, transparent); color: color-mix(in srgb, var(--success-500) 80%, var(--ink-900)); }
.mini-item .mi-txt { flex: 1; color: var(--ink-800); line-height: 1.5; word-break: break-word; }
.mini-item .mi-date { flex: none; font-size: 11px; color: var(--ink-400); }
.mini-item .icon-btn { margin-top: -4px; opacity: 0.45; }
.mini-item:hover .icon-btn { opacity: 1; }

.timeline {
  position: relative;
  display: flex;
  flex-direction: column;
  max-height: 280px;
  overflow-y: auto;
  margin-top: 6px;
  padding: 4px 0 4px 2px;
}
.tl-item { position: relative; display: flex; gap: 11px; padding: 7px 0; }
.tl-item::before {
  content: "";
  position: absolute;
  left: 4px;
  top: 22px;
  bottom: -3px;
  width: 1px;
  background: var(--ink-200);
}
.tl-item:last-child::before { display: none; }
.tl-dot {
  flex: none;
  width: 9px;
  height: 9px;
  margin-top: 5px;
  border-radius: 50%;
  background: var(--ink-0);
  border: 2px solid var(--brand-500);
  z-index: 1;
}
.tl-body { flex: 1; min-width: 0; }
.tl-meta { font-size: 10.5px; font-weight: 700; color: var(--ink-400); letter-spacing: 0.02em; }
.tl-text { margin-top: 2px; font-size: 12.5px; color: var(--ink-800); line-height: 1.55; word-break: break-word; }
.tl-item .icon-btn { margin-top: -2px; opacity: 0.45; }
.tl-item:hover .icon-btn { opacity: 1; }

/* ---------- day modal ---------- */
.day-sec { padding-bottom: 6px; }
.day-sec + .day-sec { border-top: 1px solid var(--ink-100); padding-top: 4px; }
.day-empty { padding: 12px 2px; font-size: 12px; color: var(--ink-400); }

/* ---------- resources ---------- */
.issue-tbl td { vertical-align: top; }
.issue-tbl .cat-cell { width: 96px; }
.issue-tbl .items { display: flex; flex-wrap: wrap; gap: 4px; }
.issue-tbl .amt { text-align: right; white-space: nowrap; font-weight: 800; color: var(--ink-900); }
.issue-tbl tr.cat-row td { border-bottom: 1px solid var(--ink-100); }

.formula-card {
  max-width: 820px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: 1fr auto 1fr auto 1fr;
  align-items: center;
  gap: 10px;
  padding: 18px;
}
.fc-box {
  text-align: center;
  padding: 14px 10px;
  border-radius: var(--r-md);
  background: var(--ink-25);
  border: 1px solid var(--ink-200);
}
.fc-box .fc-num { font-size: 26px; font-weight: 900; letter-spacing: -1px; color: var(--ink-900); }
.fc-box .fc-num em { font-style: normal; color: var(--brand-600); }
.fc-box .fc-label { font-size: 11.5px; font-weight: 700; color: var(--ink-500); margin-top: 3px; }
.fc-op { font-size: 16px; font-weight: 800; color: var(--ink-300); }

.doc-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.doc {
  display: flex;
  flex-direction: column;
  border: 1px solid var(--ink-200);
  border-radius: var(--r-md);
  background: var(--ink-0);
  overflow: hidden;
}
.doc-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 11px 14px 0;
}
.doc-cat {
  font-size: 10.5px;
  font-weight: 800;
  color: var(--brand-700);
  background: var(--brand-50);
  border: 1px solid color-mix(in srgb, var(--brand-500) 20%, transparent);
  border-radius: var(--r-pill);
  padding: 2px 8px;
}
.doc-actions { display: flex; gap: 2px; opacity: 0.6; transition: opacity 0.15s; }
.doc:hover .doc-actions { opacity: 1; }
.doc h4 { padding: 8px 14px 0; font-size: 13.5px; font-weight: 800; color: var(--ink-900); letter-spacing: -0.2px; line-height: 1.4; }
.doc-body {
  flex: 1;
  margin: 9px 0 0;
  padding: 0 14px 14px;
  font-size: 12px;
  line-height: 1.72;
  color: var(--ink-700);
  white-space: pre-wrap;
  word-break: break-word;
  max-height: 300px;
  overflow-y: auto;
}

/* ---------- misc ---------- */
.loading-box {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  padding: 70px 20px;
  color: var(--ink-400);
  font-size: 13px;
}
.spinner {
  width: 22px;
  height: 22px;
  border: 2.5px solid var(--ink-100);
  border-top-color: var(--brand-500);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.foot { margin-top: 26px; text-align: center; font-size: 11px; color: var(--ink-400); line-height: 1.7; }

.skel { background: var(--ink-100); border-radius: 8px; animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }

/* ---------- responsive ---------- */
@media (max-width: 1080px) {
  .cal-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .gauges { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .gauge:nth-child(3) { border-left: 0; }
  .gauge:nth-child(n+3) { border-top: 1px solid var(--ink-100); }
}

<script>
window.__SEED = {"issues": [{"name": "특허", "category": "인증", "amount": 2000000, "sort_order": 10}, {"name": "연구소", "category": "인증", "amount": 2000000, "sort_order": 20}, {"name": "벤처", "category": "인증", "amount": 2000000, "sort_order": 30}, {"name": "이노비즈", "category": "인증", "amount": 2000000, "sort_order": 40}, {"name": "메인비즈", "category": "인증", "amount": 2000000, "sort_order": 50}, {"name": "여성기업", "category": "인증", "amount": 2000000, "sort_order": 60}, {"name": "대출", "category": "자금조달", "amount": 1000000, "sort_order": 70}, {"name": "대환", "category": "자금조달", "amount": 1000000, "sort_order": 80}, {"name": "이자", "category": "자금조달", "amount": 1000000, "sort_order": 90}, {"name": "무상지원금", "category": "자금조달", "amount": 1000000, "sort_order": 100}, {"name": "가지급금", "category": "세금이슈", "amount": 1000000, "sort_order": 110}, {"name": "가수금", "category": "세금이슈", "amount": 1000000, "sort_order": 120}, {"name": "미처분이익잉여금", "category": "세금이슈", "amount": 1000000, "sort_order": 130}, {"name": "가업승계", "category": "가업승계", "amount": 2000000, "sort_order": 140}, {"name": "정관", "category": "경영자문", "amount": 500000, "sort_order": 150}, {"name": "경영", "category": "경영자문", "amount": 500000, "sort_order": 160}, {"name": "창업", "category": "경영자문", "amount": 500000, "sort_order": 170}], "resources": [{"id": 1, "category": "전화 스크립트", "title": "첫 전화 · 미팅 약속 기본 스크립트", "body": "[오프닝 – 30초 규칙]\n“안녕하세요, 황윤철 팀장입니다. ○○ 대표님 계시죠? 바쁘신 시간에 죄송합니다. 딱 30초만 말씀드리고 끊겠습니다.”\n\n[명분 – 왜 지금 전화했는지]\n“최근 ○○업종 대표님들이 많이 문의하시는 [특허 / 운영자금 / 가지급금] 이슈로 연락드렸습니다. 같은 규모 업체 중에 아직 검토 전이신 곳이 많아서 대표님께 먼저 알려드리는 게 좋겠다 싶었습니다.”\n\n[미팅 약속 – 선택형 질문]\n“전화로 설명드리면 길어지니까, 15분만 시간 내주시면 좋겠습니다. 이번 주 목요일 오전 10시, 금요일 오후 2시 중에 어느 쪽이 편하세요?”\n· “가능하세요?”가 아니라 두 시간 중 하나를 고르게 한다.\n· 망설이면 “그럼 다음 주 화요일 오전으로 잡아두고, 일정 바뀌시면 문자 주세요.”\n\n[확정]\n“○○일 ○○시에 사무실로 찾아뵙겠습니다. 주소는 ○○로 ○○ 맞으시죠? 준비하실 서류는 없고, 대표님만 계시면 됩니다.”\n\n[끊기 전]\n“확인 문자 바로 드리겠습니다. 감사합니다.”", "sort_order": 10, "updated_at": "2026-11-27T02:23:56.826543+00:00"}, {"id": 2, "category": "이슈별 화법", "title": "인증 이슈 (특허·연구소·벤처·이노비즈·메인비즈·여성기업)", "body": "[한 줄 후킹]\n“대표님 업체는 특허·벤처·이노비즈 중에 아직 받지 못한 게 있으실 것 같아서요. 인증 하나로 3년간 세제 혜택과 정부사업 가점이 같이 따라옵니다.”\n\n[진단 질문]\n· “지금 보유하신 인증이 벤처기업 인증까지 맞으세요?”\n· “연구소는 설립하셨어요? 연구전담요원은 몇 분이세요?”\n· “올해 정부 지원사업 공고에 신청해 보신 적 있으세요?”\n\n[가치 제시]\n“인증은 한 번 받으면 3년 유지이고, 나라장터·정부지원사업 가점이 붙습니다. 견적은 200만원 선이고, 보통 2~3개월 걸립니다.”\n\n[클로징]\n“보유 인증만 확인하면 받을 수 있는 게 바로 나옵니다. 15분만 시간 주시면 서류 체크해 드릴게요.”", "sort_order": 20, "updated_at": "2026-11-27T02:23:56.931716+00:00"}, {"id": 3, "category": "이슈별 화법", "title": "자금조달 이슈 (대출·대환·이자·무상지원금)", "body": "[후킹]\n“요즘 은행권 대출 금리가 올라서 대환 문의가 많습니다. 지금 쓰시는 대출 금리가 연 6%를 넘으시면 바꾸는 것만으로 이자가 줄어듭니다.”\n\n[진단]\n· “현재 대출 잔액과 금리가 어떻게 되세요?”\n· “기보·신보 보증은 사용해 보셨어요?”\n· “정책자금(무상지원금)은 올해 신청하셨나요?”\n\n[가치]\n“대환은 금리 1~2%p 차이로도 연 수백만원이 달라집니다. 무상지원금은 상환 없이 받는 자금이라 가장 먼저 챙기셔야 합니다.”\n\n[클로징]\n“사업자등록번호만 주시면 조회해서 받을 수 있는 자금 리스트를 3일 안에 정리해 드립니다. 다음 주에 결과 들고 방문드릴게요.”", "sort_order": 30, "updated_at": "2026-11-27T02:23:57.010656+00:00"}, {"id": 4, "category": "이슈별 화법", "title": "세금이슈 화법 (가지급금·가수금·미처분이익잉여금)", "body": "[후킹]\n“대표님, 가지급금이나 가수금이 장부에 남아 있으면 세무조사 때 바로 지적됩니다. 미처분이익잉여금도 그대로 두면 법인세 부담이 커집니다.”\n\n[진단]\n· “가수금 잔액이 아직 남아 있으세요?”\n· “대표님 가지급금은 얼마 정도 되세요?”\n· “작년 결산 때 미처분이익잉여금 정리하셨나요?”\n\n[가치]\n“정리 시점과 방법에 따라 세금이 몇 배 차이 납니다. 200만원 예상으로, 3개월 안에 정리 가능합니다.”\n\n[클로징]\n“재무제표 한 장만 보여주시면 어디부터 손대야 하는지 바로 짚어드립니다.”", "sort_order": 40, "updated_at": "2026-11-27T02:23:57.079988+00:00"}, {"id": 5, "category": "이슈별 화법", "title": "가업승계 화법", "body": "[후킹]\n“대표님, 가업승계는 10년 전부터 준비하셔야 세금이 줄어듭니다. 지금 시작하시면 증여공제 10년을 두 번 쓸 수 있습니다.”\n\n[진단]\n· “자녀분 중에 회사를 이어받을 분이 있으세요?”\n· “지분은 현재 어떻게 나뉘어 있나요?”\n· “증여는 한 번도 안 하셨죠?”\n\n[가치]\n“가업승계는 200만원 예상으로, 5년 이상 장기 플랜으로 진행합니다. 늦게 시작하면 세금이 수억씩 달라질 수 있습니다.”\n\n[클로징]\n“가족관계와 지분 현황만 알려주시면 두 가지 시나리오로 비교해 드립니다.”", "sort_order": 50, "updated_at": "2026-11-27T02:23:57.170587+00:00"}, {"id": 6, "category": "이슈별 화법", "title": "경영자문 화법 (정관·경영·창업)", "body": "[후킹]\n“정관 한 장만 바꿔도 대표님 권한과 배당 구조가 달라집니다. 경영·창업 자문은 50만원 선에서 시작합니다.”\n\n[진단]\n· “정관은 설립 때 그대로 쓰고 계시죠?”\n· “주주 간 계약서는 따로 있으세요?”\n\n[가치]\n“정관 정비는 2주면 끝나고, 이후 의사결정이 훨씬 빨라집니다.”\n\n[클로징]\n“정관 사본 한 부만 보내주시면 문제되는 조항만 표시해서 보여드리겠습니다.”", "sort_order": 60, "updated_at": "2026-11-27T02:23:57.267128+00:00"}, {"id": 7, "category": "상담 스크립트", "title": "미팅 상담 스크립트 (5단계)", "body": "1. 라포 (2분)\n“오시는 길 불편하시진 않으셨어요? 사무실이 깔끔하시네요. 몇 년 되셨어요?”\n\n2. 현황 진단 (5분)\n“지금 매출 규모와 직원 수는 어떻게 되세요? 올해 목표는 어디까지 보셨어요?”\n· 대표가 말하게 하고, 메모하는 모습을 보여준다.\n\n3. 이슈 발견 (5분)\n“말씀 들으니 [인증/자금/세금] 쪽이 먼저 정리되어야 할 것 같습니다. 이 부분 지금 어떻게 처리하고 계세요?”\n\n4. 해결책 제시 (5분)\n“저희가 비슷한 업체 3곳을 진행했습니다. A사는 특허 2건으로 3개월, B사는 대환으로 이자 1,800만원을 줄였습니다.”\n· 금액은 예상치로만 말하고 확정 약속은 하지 않는다.\n\n5. 다음 약속 (3분)\n“오늘 말씀 정리해서 3일 안에 자료 보내드릴게요. 다음 주 화요일 오전에 다시 뵙고 진행 여부 정하실까요?”\n\n[마무리]\n“오늘 시간 내주셔서 감사합니다. 나가면서 명함 한 장 두고 가겠습니다.”", "sort_order": 70, "updated_at": "2026-11-27T02:23:57.340074+00:00"}, {"id": 8, "category": "후속 연락", "title": "후속 연락 스크립트 (D+1 / D+3 / D+7 / D+14)", "body": "[D+1 – 감사 문자]\n“대표님, 오늘 시간 내주셔서 감사합니다. 말씀하신 [특허 2건 / 대환] 건 정리해서 내일까지 보내드리겠습니다. – 황윤철”\n\n[D+3 – 자료 발송]\n“요청하신 자료 보내드립니다. 1페이지에 예상 비용과 기간만 정리했습니다. 궁금하신 점은 언제든 연락 주세요.”\n\n[D+7 – 전화]\n“자료 보신 것 같아서요. 어느 부분이 제일 걸리세요? 예산이면 분할도 가능합니다.”\n\n[D+14 – 마지막]\n“계속 연락드리는 게 실례일 것 같아 마지막으로 연락드립니다. 지금 아니어도 12월에 다시 여쭤봐도 될까요?”\n· ‘마지막 연락’이라고 말하면 오히려 회신률이 올라간다.", "sort_order": 80, "updated_at": "2026-11-27T02:23:57.42207+00:00"}, {"id": 9, "category": "반론 대응", "title": "반론 대응 모음", "body": "[“바빠요”]\n“바쁘신 거 압니다. 그래서 15분만 요청드렸습니다. 다음 주 중에 30분 통화로 대신할까요?”\n\n[“비싸요”]\n“네, 200만원이 작지 않습니다. 다만 인증 하나로 3년간 받는 세제 혜택과 가점을 계산하면 첫해에 회수됩니다. 분할 결제도 가능합니다.”\n\n[“이미 하고 있어요”]\n“어디까지 진행하셨어요? 저희는 인증은 받았는데 유지보수에서 놓치는 경우를 많이 봤습니다. 한 번만 점검해 드릴까요?”\n\n[“생각해보겠습니다”]\n“당연합니다. 그럼 제가 정리한 자료만 보고 판단하실 수 있게 3일 뒤에 한 번만 여쭤봐도 될까요?”", "sort_order": 90, "updated_at": "2026-11-27T02:23:57.501593+00:00"}, {"id": 10, "category": "클로징", "title": "계약 클로징 체크리스트", "body": "□ 예상 금액과 범위를 문서로 확인받았다\n□ 진행 기간(착수일·완료 예정일)을 합의했다\n□ 결제 조건(계약금/잔금 비율)을 정했다\n□ 필요 서류 목록을 전달했다\n□ 담당자 연락처를 교환했다\n□ 다음 액션 날짜를 캘린더에 등록했다\n□ 계약서 사본을 양측이 보관한다\n□ 첫 주 진행 상황을 문자로 안내한다", "sort_order": 100, "updated_at": "2026-11-27T02:23:57.585713+00:00"}, {"id": 11, "category": "참고", "title": "진행률 산식 안내", "body": "업체별 진행률 = (미팅 건수 ÷ 7) × 70% + (전화 건수 ÷ 7) × 30% (최대 100%)\n· 영업 성공 공식: 업체 1건당 미팅 7건\n· 상태가 계약완료이면 진행률 100%로 표시됩니다.\n· 미팅·전화는 업체 상세의 기록에서 추가하면 대시보드에 실시간 반영됩니다.", "sort_order": 110, "updated_at": "2026-11-27T02:23:57.931639+00:00"}], "monthly": [{"id": 1, "month_key": "2026-11", "title": "자금", "done": false}, {"id": 2, "month_key": "2026-11", "title": "인증", "done": false}, {"id": 3, "month_key": "2026-11", "title": "수출바우처", "done": false}, {"id": 4, "month_key": "2026-11", "title": "도약패키지", "done": false}]};

  function open() {

    dbp = new Promise(function (resolve, reject) {
      var r = indexedDB.open(DB_NAME, DB_VER);

        STORES.forEach(function (s) {
          if (!db.objectStoreNames.contains(s)) db.createObjectStore(s, { keyPath: 'id' });

    return dbp;
  }

  function reqp(req) {
    return new Promise(function (resolve, reject) {
      req.onsuccess = function () { resolve(req.result); };
      req.onerror = function () { reject(req.error); };
    });
  }

  function all(store) {
    return open().then(function (db) {
      return reqp(db.transaction(store, 'readonly').objectStore(store).getAll());
    });
  }

  function put(store, obj) {
    return open().then(function (db) {
      return new Promise(function (resolve, reject) {
        var t = db.transaction(store, 'readwrite');
        t.objectStore(store).put(obj);
        t.oncomplete = function () { resolve(obj); };
        t.onerror = function () { reject(t.error); };
      });
    });
  }

  function remove(store, id) {
    return open().then(function (db) {
      return new Promise(function (resolve, reject) {
        var t = db.transaction(store, 'readwrite');
        t.objectStore(store).delete(id);
        t.oncomplete = function () { resolve(true); };
        t.onerror = function () { reject(t.error); };
      });
    });
  }

  function removeWhere(store, fn) {
    return all(store).then(function (rows) {
      return Promise.all(rows.filter(fn).map(function (r) { return remove(store, r.id); }));
    });
  }

  var seeded = null;
  function ready() {
    if (seeded) return seeded;
    seeded = open().then(function (db) {
      return reqp(db.transaction('meta', 'readonly').objectStore('meta').get('seed'));
    }).then(function (flag) {
      if (flag) return true;
      var jobs = [];
      SEED.issues.forEach(function (i) { jobs.push(put('issues', { id: i.name, name: i.name, category: i.category, amount: i.amount, sort_order: i.sort_order })); });
      SEED.resources.forEach(function (r) { jobs.push(put('resources', r)); });
      SEED.monthly.forEach(function (m) { jobs.push(put('monthly', m)); });
      return Promise.all(jobs).then(function () {
        return put('meta', { id: 'seed', at: new Date().toISOString() });
      }).then(function () { return true; });
    });
    return seeded;
  }

  /* ---------------- helpers ---------------- */
  function pad(n) { return String(n).padStart(2, '0'); }
  function iso(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function todayISO() { return iso(new Date()); }
  function ds(v) { return v == null ? '' : String(v).slice(0, 10); }

  function nextId(store) {
    return all(store).then(function (rows) {
      return rows.reduce(function (m, r) { return Math.max(m, Number(r.id) || 0); }, 0) + 1;
    });
  }

  function issueMap() {
    return all('issues').then(function (rows) {
      var map = {};
      rows.forEach(function (r) { map[r.name] = r; });
      return map;
    });
  }

  function amountOf(c, map) {
    return String(c.issues || '').split(',').map(function (s) { return s.trim(); }).filter(Boolean)
      .reduce(function (sum, n) { return sum + (map[n] ? Number(map[n].amount) || 0 : 0); }, 0);
  }

  function companiesView() {
    return Promise.all([all('companies'), all('activities'), all('logs'), issueMap()]).then(function (res) {
      var cs = res[0], acts = res[1], logs = res[2], map = res[3];
      return cs.map(function (c) {
        var a = acts.filter(function (x) { return Number(x.company_id) === Number(c.id); });
        var l = logs.filter(function (x) { return Number(x.company_id) === Number(c.id); });
        var lastLog = l.map(function (x) { return ds(x.log_date); }).sort().pop() || null;
        return Object.assign({}, c, {
          meetings: a.filter(function (x) { return x.act_type === 'meeting'; }).length,
          calls: a.filter(function (x) { return x.act_type === 'call'; }).length,
          log_count: l.length,
          last_log_date: lastLog,
          expected_amount: amountOf(c, map)
        });
      }).sort(function (x, y) { return String(y.created_at || '').localeCompare(String(x.created_at || '')); });
    });
  }

  function calendarView(start, end) {
    return Promise.all([all('activities'), all('todos'), all('logs'), all('companies')]).then(function (res) {
      var acts = res[0], todos = res[1], logs = res[2], cs = res[3];
      var name = {};
      cs.forEach(function (c) { name[c.id] = c.name; });
      var inRange = function (d) { return (!start || d >= start) && (!end || d <= end); };
      var rows = [];
      logs.forEach(function (l) {
        var d = ds(l.log_date);
        if (!inRange(d)) return;
        rows.push({ kind: 'log', sub: 'log', d: d, id: l.id, title: name[l.company_id] || '업체', detail: l.content || '', company_id: l.company_id, is_done: null });
      });
      acts.forEach(function (a) {
        var d = ds(a.act_date);
        if (!inRange(d)) return;
        rows.push({ kind: 'activity', sub: a.act_type, d: d, id: a.id, title: name[a.company_id] || '업체', detail: a.content || '', company_id: a.company_id, is_done: null });
      });
      todos.forEach(function (t) {
        var d = ds(t.todo_date);
        if (!inRange(d)) return;
        rows.push({ kind: 'todo', sub: t.kind, d: d, id: t.id, title: t.title, detail: '', company_id: null, is_done: !!t.done });
      });
      return rows.sort(function (x, y) { return x.d === y.d ? (x.kind > y.kind ? 1 : -1) : (x.d > y.d ? 1 : -1); });
    });
  }

  function summaryView() {
    return Promise.all([companiesView(), all('activities'), all('todos'), all('logs')]).then(function (res) {
      var cs = res[0], acts = res[1], todos = res[2], logs = res[3];
      var t = todayISO();
      return {
        company_count: cs.length,
        contract_count: cs.filter(function (c) { return c.status === '계약완료'; }).length,
        contract_amount: cs.filter(function (c) { return c.status === '계약완료'; }).reduce(function (s, c) { return s + c.expected_amount; }, 0),
        ongoing_count: cs.filter(function (c) { return c.status === '진행중'; }).length,
        meetings: acts.filter(function (a) { return a.act_type === 'meeting'; }).length,
        calls: acts.filter(function (a) { return a.act_type === 'call'; }).length,
        meetings_today: acts.filter(function (a) { return a.act_type === 'meeting' && ds(a.act_date) === t; }).length,
        calls_today: acts.filter(function (a) { return a.act_type === 'call' && ds(a.act_date) === t; }).length,
        todos_open: todos.filter(function (x) { return !x.done; }).length,
        log_count: logs.length
      };
    });
  }

  /* ---------------- query router ---------------- */
  function run(name, p) {
    p = p || {};
    switch (name) {
      case 'load_issue_types':
        return all('issues').then(function (r) {
          return r.sort(function (a, b) { return (a.sort_order || 0) - (b.sort_order || 0); });
        });

      case 'load_companies':
        return companiesView();

      case 'load_company':
        return companiesView().then(function (cs) {
          return cs.filter(function (c) { return Number(c.id) === Number(p.id); });
        });

      case 'load_company_logs':
        return all('logs').then(function (rows) {
          return rows.filter(function (r) { return Number(r.company_id) === Number(p.company_id); })
            .sort(function (a, b) { return String(b.log_date).localeCompare(String(a.log_date)); });
        });

      case 'load_company_activities':
        return all('activities').then(function (rows) {
          return rows.filter(function (r) { return Number(r.company_id) === Number(p.company_id); })
            .sort(function (a, b) { return String(b.act_date).localeCompare(String(a.act_date)); });
        });

      case 'dashboard_summary':
        return summaryView().then(function (s) { return [s]; });

      case 'load_calendar':
        return calendarView(ds(p.start), ds(p.end));

      case 'load_day':
        return calendarView(ds(p.d), ds(p.d));

      case 'load_todos_date':
        return all('todos').then(function (rows) {
          return rows.filter(function (r) { return ds(r.todo_date) === ds(p.d); })
            .sort(function (a, b) { return (a.id || 0) - (b.id || 0); });
        });

      case 'load_monthly_issues':
        return all('monthly').then(function (rows) {
          return rows.filter(function (r) { return !p.month_key || r.month_key === p.month_key; })
            .sort(function (a, b) { return (a.id || 0) - (b.id || 0); });
        });

      case 'load_resources':
        return all('resources').then(function (rows) {
          return rows.sort(function (a, b) { return (a.sort_order || 0) - (b.sort_order || 0); });
        });

      case 'load_resource_files':
        return all('files').then(function (rows) {
          return rows.map(function (f) {
            return {
              id: f.id, title: f.title, category: f.category, file_name: f.file_name,
              mime_type: f.mime_type, file_size: f.file_size, note: f.note,
              sort_order: f.sort_order || 0, created_at: f.created_at
            };
          }).sort(function (a, b) { return String(b.created_at).localeCompare(String(a.created_at)); });
        });

      case 'get_resource_file':
        return all('files').then(function (rows) {
          return rows.filter(function (f) { return Number(f.id) === Number(p.id); });
        });

      /* ---- writes ---- */
      case 'insert_company':
        return nextId('companies').then(function (id) {
          return put('companies', {
            id: id, name: p.name, region: p.region || null, address: p.address || null,
            ceo: p.ceo || null, phone: p.phone || null, issues: p.issues || '',
            status: p.status || '신규', memo: p.memo || null,
            created_at: new Date().toISOString()
          });
        }).then(function (row) { return [row]; });

      case 'update_company':
        return all('companies').then(function (rows) {
          var cur = rows.filter(function (r) { return Number(r.id) === Number(p.id); })[0];
          if (!cur) throw new Error('업체를 찾을 수 없습니다');
          return put('companies', Object.assign({}, cur, {
            name: p.name, region: p.region || null, address: p.address || null,
            ceo: p.ceo || null, phone: p.phone || null, issues: p.issues || '',
            status: p.status || '신규', memo: p.memo || null
          }));
        }).then(function (row) { return [row]; });

      case 'delete_company':
        return remove('companies', Number(p.id))
          .then(function () { return removeWhere('logs', function (r) { return Number(r.company_id) === Number(p.id); }); })
          .then(function () { return removeWhere('activities', function (r) { return Number(r.company_id) === Number(p.id); }); })
          .then(function () { return [{ id: Number(p.id) }]; });

      case 'insert_log':
        return nextId('logs').then(function (id) {
          return put('logs', {
            id: id, company_id: Number(p.company_id), log_date: ds(p.log_date) || todayISO(),
            content: p.content, created_at: new Date().toISOString()
          });
        }).then(function (r) { return [r]; });

      case 'delete_log':
        return remove('logs', Number(p.id)).then(function () { return [{ id: Number(p.id) }]; });

      case 'insert_activity':
        return nextId('activities').then(function (id) {
          return put('activities', {
            id: id, company_id: Number(p.company_id), act_type: p.act_type,
            act_date: ds(p.act_date) || todayISO(), content: p.content || '',
            created_at: new Date().toISOString()
          });
        }).then(function (r) { return [r]; });

      case 'delete_activity':
        return remove('activities', Number(p.id)).then(function () { return [{ id: Number(p.id) }]; });

      case 'insert_todo':
        return nextId('todos').then(function (id) {
          return put('todos', {
            id: id, todo_date: ds(p.todo_date) || todayISO(), kind: p.kind || '기타',
            title: p.title, done: false, created_at: new Date().toISOString()
          });
        }).then(function (r) { return [r]; });

      case 'set_todo_done':
        return all('todos').then(function (rows) {
          var cur = rows.filter(function (r) { return Number(r.id) === Number(p.id); })[0];
          if (!cur) throw new Error('할 일을 찾을 수 없습니다');
          return put('todos', Object.assign({}, cur, { done: !!p.done }));
        }).then(function (r) { return [r]; });

      case 'delete_todo':
        return remove('todos', Number(p.id)).then(function () { return [{ id: Number(p.id) }]; });

      case 'insert_monthly_issue':
        return nextId('monthly').then(function (id) {
          return put('monthly', {
            id: id, month_key: p.month_key, title: p.title, done: false,
            created_at: new Date().toISOString()
          });
        }).then(function (r) { return [r]; });

      case 'set_monthly_issue_done':
        return all('monthly').then(function (rows) {
          var cur = rows.filter(function (r) { return Number(r.id) === Number(p.id); })[0];
          if (!cur) throw new Error('이슈를 찾을 수 없습니다');
          return put('monthly', Object.assign({}, cur, { done: !!p.done }));
        }).then(function (r) { return [r]; });

      case 'delete_monthly_issue':
        return remove('monthly', Number(p.id)).then(function () { return [{ id: Number(p.id) }]; });

      case 'insert_resource':
        return nextId('resources').then(function (id) {
          return put('resources', {
            id: id, category: p.category || '자료', title: p.title, body: p.body || '',
            sort_order: 1000 + id, updated_at: new Date().toISOString()
          });
        }).then(function (r) { return [r]; });

      case 'update_resource':
        return all('resources').then(function (rows) {
          var cur = rows.filter(function (r) { return Number(r.id) === Number(p.id); })[0];
          if (!cur) throw new Error('자료를 찾을 수 없습니다');
          return put('resources', Object.assign({}, cur, {
            category: p.category || '자료', title: p.title,
            body: p.body == null ? cur.body : p.body,
            updated_at: new Date().toISOString()
          }));
        }).then(function (r) { return [r]; });

      case 'delete_resource':
        return remove('resources', Number(p.id)).then(function () { return [{ id: Number(p.id) }]; });

      case 'insert_resource_file':
        return nextId('files').then(function (id) {
          return put('files', {
            id: id, title: p.title, category: p.category || '자료', file_name: p.file_name,
            mime_type: p.mime_type, file_size: Number(p.file_size) || 0,
            data_url: p.data_url, note: p.note || null,
            sort_order: 0, created_at: new Date().toISOString()
          });
        }).then(function (r) {
          return [{ id: r.id, title: r.title, category: r.category, file_name: r.file_name, mime_type: r.mime_type, file_size: r.file_size, note: r.note, sort_order: r.sort_order, created_at: r.created_at }];
        });

      case 'update_resource_file':
        return all('files').then(function (rows) {
          var cur = rows.filter(function (r) { return Number(r.id) === Number(p.id); })[0];
          if (!cur) throw new Error('자료를 찾을 수 없습니다');
          return put('files', Object.assign({}, cur, {
            title: p.title, category: p.category || '자료', note: p.note || null
          }));
        }).then(function (r) {
          return [{ id: r.id, title: r.title, category: r.category, file_name: r.file_name, mime_type: r.mime_type, file_size: r.file_size, note: r.note, sort_order: r.sort_order, created_at: r.created_at }];
        });

      case 'delete_resource_file':
        return remove('files', Number(p.id)).then(function () { return [{ id: Number(p.id) }]; });

      default:
        return [];
    }
  }

  window.agentdb = {
    executeQuery: function (name, params) {
      return ready().then(function () { return run(name, params); }).then(function (rows) {
        return { columns: [], rows: rows || [], row_count: (rows || []).length };
      });
    },
    confirm: function (m) { return Promise.resolve(window.confirm(m)); },
    alert: function (m) { window.alert(m); return Promise.resolve(); },
    prompt: function (m, o) { return Promise.resolve(window.prompt(m, (o && o.defaultValue) || '')); },
    download: function () { return Promise.resolve(); }
  };

  /* ---------------- backup + notice ---------------- */
  window.__exportData = function () {
    return Promise.all(STORES.filter(function (s) { return s !== 'meta'; }).map(function (s) {
      return all(s).then(function (rows) { return [s, rows]; });
    })).then(function (pairs) {
      var out = { exported_at: new Date().toISOString(), version: 1 };
      pairs.forEach(function (p) { out[p[0]] = p[1]; });
      var blob = new Blob([JSON.stringify(out, null, 2)], { type: 'application/json' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = '영업대시보드_백업_' + todayISO() + '.json';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
    });
  };

  var tries = 0;
  var timer = setInterval(function () {
    tries++;
    var content = document.getElementById('content');
    if (content && content.querySelector('#topbar')) {
      clearInterval(timer);
      var note = document.createElement('div');
      note.className = 'preview-note';
      note.innerHTML = '이 웹 버전은 입력·업로드한 내용을 <b>이 브라우저</b>에 저장합니다 (다른 기기·브라우저와 공유되지 않음). '
        + '<button type="button" class="note-link" id="backup-json">JSON으로 백업</button>';
      content.appendChild(note);
      var b = note.querySelector('#backup-json');
      if (b) b.onclick = function () { window.__exportData(); };
    }
    if (tries > 100) clearInterval(timer);
  }, 150);
})();

<script>
/* =========================================================

window.App = window.App || {};
(function () {

  var A = window.App;

  A.C = {

      '강원', '충북', '충남', '전북', '전남', '경북', '경남', '제주'],
    STATUSES: ['신규', '진행중', '계약완료', '보류'],
