      { key: '2026-12', label: '2026년 12월', short: '12월' },
      { key: '2027-01', label: '2027년 1월', short: '1월' },
      { key: '2027-02', label: '2027년 2월', short: '2월' },
      { key: '2027-03', label: '2027년 3월', short: '3월' },
      { key: '2027-04', label: '2027년 4월', short: '4월' }
    ],
    CAT_ORDER: ['인증', '자금조달', '세금이슈', '가업승계', '경영자문'],
    CAT_COLOR: {
      '인증': 'cert', '자금조달': 'fund', '세금이슈': 'tax',
      '가업승계': 'inherit', '경영자문': 'consult'
    },
    STATUS_CLASS: { '신규': 'st-new', '진행중': 'st-active', '계약완료': 'st-done', '보류': 'st-hold' }
  };

  A.state = {
    tab: 'dashboard',
    loaded: false,
    issues: [],
    issueMap: {},
    companies: [],
    summary: {},
    resources: [],
    resourceFiles: [],
    monthly: [],
    monthKey: '2026-11',
    calendar: [],
    evMap: {},
    calGroup: 0,
    filters: { q: '', region: '', status: '' }
  };

  /* ---------------- format ---------------- */
  A.esc = function (v) {
    if (v === null || v === undefined) return '';
    if (window.gsDash && gsDash.esc) return gsDash.esc(String(v));
    return String(v).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  };

  A.pad = function (n) { return String(n).padStart(2, '0'); };

  A.todayISO = function () {
    var d = new Date();
    return d.getFullYear() + '-' + A.pad(d.getMonth() + 1) + '-' + A.pad(d.getDate());
  };

  A.iso = function (d) {
    return d.getFullYear() + '-' + A.pad(d.getMonth() + 1) + '-' + A.pad(d.getDate());
  };

  A.parseISO = function (s) {
    var p = String(s || '').split('-');
    return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
  };

  A.fmtDate = function (s) {
    if (!s) return '-';
    return String(s).slice(0, 10).replace(/-/g, '.');
  };

  var DOW_KO = ['일', '월', '화', '수', '목', '금', '토'];
  A.fmtDateKo = function (s) {
    if (!s) return '-';
    var d = A.parseISO(String(s).slice(0, 10));
    return d.getFullYear() + '년 ' + (d.getMonth() + 1) + '월 ' + d.getDate() + '일 (' + DOW_KO[d.getDay()] + ')';
  };

  A.won = function (n) {
    var v = Number(n) || 0;
    if (v === 0) return '0원';
    if (v % 10000 === 0) return (v / 10000).toLocaleString('ko-KR') + '만원';
    return v.toLocaleString('ko-KR') + '원';
  };

  A.fmtSize = function (n) {
    var v = Number(n) || 0;
    if (v < 1024) return v + 'B';
    if (v < 1024 * 1024) return Math.round(v / 1024) + 'KB';
    return (v / 1024 / 1024).toFixed(1) + 'MB';
  };

  /* file helpers ------------------------------------------------ */
  A.fileKind = function (mime, name) {
    var ext = String(name || '').split('.').pop().toLowerCase();
    var m = String(mime || '').toLowerCase();
    if (m.indexOf('image/') === 0) return 'img';
    if (m === 'application/pdf' || ext === 'pdf') return 'pdf';
    if (/word|document|hwp|oword/.test(m) || ['doc', 'docx', 'hwp', 'hwpx', 'odt', 'rtf'].indexOf(ext) >= 0) return 'doc';
    if (/sheet|excel|csv/.test(m) || ['xls', 'xlsx', 'csv', 'ods'].indexOf(ext) >= 0) return 'sheet';
    if (/presentation|powerpoint/.test(m) || ['ppt', 'pptx', 'odp'].indexOf(ext) >= 0) return 'ppt';
    if (m.indexOf('text/') === 0 || ['txt', 'md', 'json', 'xml'].indexOf(ext) >= 0) return 'text';
    return 'etc';
  };

  A.fileKindLabel = {
    img: 'IMAGE', pdf: 'PDF', doc: 'DOC', sheet: 'XLS', ppt: 'PPT', text: 'TXT', etc: 'FILE'
  };

  A.guessMime = function (name) {
    var ext = String(name || '').split('.').pop().toLowerCase();
    var map = {
      pdf: 'application/pdf', png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg',
      gif: 'image/gif', webp: 'image/webp', svg: 'image/svg+xml',
      txt: 'text/plain', csv: 'text/csv', md: 'text/markdown', json: 'application/json',
      doc: 'application/msword', docx: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document',
      xls: 'application/vnd.ms-excel', xlsx: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',
      ppt: 'application/vnd.ms-powerpoint', pptx: 'application/vnd.openxmlformats-officedocument.presentationml.presentation',
      hwp: 'application/x-hwp', hwpx: 'application/x-hwpx', zip: 'application/zip'
    };
    return map[ext] || 'application/octet-stream';
  };

  A.dataUrlToBlob = function (dataUrl) {
    var s = String(dataUrl || '');
    var comma = s.indexOf(',');
    if (comma < 0) throw new Error('파일 데이터가 올바르지 않습니다');
    var meta = s.slice(0, comma);
    var raw = s.slice(comma + 1);
    var mime = (meta.match(/^data:([^;]+)/) || [])[1] || 'application/octet-stream';
    var bin;
    if (/;base64/i.test(meta)) bin = atob(raw);
    else bin = decodeURIComponent(raw);
    var arr = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return new Blob([arr], { type: mime });
  };

  A.saveBlob = function (blob, name) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = name || 'download';
    a.rel = 'noopener';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
  };

  A.pct = function (a, b) {
    a = Number(a) || 0; b = Number(b) || 0;
    if (b <= 0) return 0;
    return Math.max(0, Math.min(100, Math.round((a / b) * 100)));
  };

  A.ddayInfo = function () {
    var now = new Date();
    var t0 = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate());
    var t1 = Date.UTC(2027, 3, 1);
    var diff = Math.round((t1 - t0) / 86400000);
    return {
      diff: diff,
      label: diff > 0 ? 'D-' + diff : (diff === 0 ? 'D-DAY' : 'D+' + Math.abs(diff))
    };
  };

  /* ---------------- company helpers ---------------- */
  A.issuesOf = function (c) {
    return String((c && c.issues) || '').split(',').map(function (s) { return s.trim(); }).filter(Boolean);
  };

  A.amountOf = function (c) {
    return A.issuesOf(c).reduce(function (sum, n) {
      var t = A.state.issueMap[n];
      return sum + (t ? Number(t.amount) || 0 : 0);
    }, 0);
  };

  A.progressOf = function (c) {
    if (!c) return 0;
    if (c.status === '계약완료') return 100;
    var m = Math.min(1, (Number(c.meetings) || 0) / 7) * 0.7;
    var p = Math.min(1, (Number(c.calls) || 0) / 7) * 0.3;
    return Math.round((m + p) * 100);
  };

  A.statusBadge = function (status) {
    var cls = A.C.STATUS_CLASS[status] || 'st-new';
    return '<span class="badge ' + cls + '">' + A.esc(status || '신규') + '</span>';
  };

  A.issueChips = function (names, max) {
    if (!names || !names.length) return '<span class="muted">-</span>';
    var limit = max || 99;
    var shown = names.slice(0, limit);
    var html = shown.map(function (n) {
      var t = A.state.issueMap[n];
      var cls = t ? (A.C.CAT_COLOR[t.category] || 'etc') : 'etc';
      return '<span class="chip ' + cls + '">' + A.esc(n) + '</span>';
    }).join('');
    if (names.length > shown.length) {
      html += '<span class="chip more">+' + (names.length - shown.length) + '</span>';
    }
    return html;
  };

  A.options = function (list, selected) {
    return list.map(function (v) {
      return '<option value="' + A.esc(v) + '"' + (v === selected ? ' selected' : '') + '>' + A.esc(v) + '</option>';
    }).join('');
  };

  /* ---------------- bridge ---------------- */
  A.q = function (name, params) {
    return window.agentdb.executeQuery(name, params || {});
  };

  A.toast = function (msg, tone) {
    if (window.gsDash && gsDash.toast) {
      try { gsDash.toast(msg, { tone: tone || 'success' }); return; } catch (e) { /* ignore */ }
    }
    console.log('[toast]', msg);
  };

  A.confirm = async function (msg) {
    if (window.agentdb && agentdb.confirm) {
      try { return await agentdb.confirm(msg, { danger: true }); } catch (e) { return false; }
    }
    return false;
  };

  /* ---------------- data ---------------- */
  A.loadAll = async function () {
    var results = await Promise.all([
      A.q('load_issue_types'),
      A.q('load_companies'),
      A.q('dashboard_summary'),
      A.q('load_resources'),
      A.q('load_monthly_issues', { month_key: A.state.monthKey }),
      A.q('load_calendar', { start: A.C.START, end: A.C.END }),
      A.q('load_resource_files')
    ]);
    var issues = results[0].rows;
    A.state.issues = issues;
    A.state.issueMap = {};
    issues.forEach(function (r) { A.state.issueMap[r.name] = r; });
    A.state.companies = results[1].rows;
    A.state.summary = results[2].rows[0] || {};
    A.state.resources = results[3].rows;
    A.state.monthly = results[4].rows;
    A.state.calendar = results[5].rows;
    A.state.resourceFiles = results[6].rows;

    var map = {};
    A.state.calendar.forEach(function (r) {
      var k = String(r.d).slice(0, 10);
      (map[k] = map[k] || []).push(r);
    });
    A.state.evMap = map;
    A.state.loaded = true;
  };

  A.refresh = async function () {
    try {
      await A.loadAll();
      A.render();
    } catch (err) {
      console.error('[data]', err);
      var body = document.getElementById('tab-body');
      if (body) {
        body.innerHTML = '<div class="card"><div class="empty">'
          + '<div class="em-title">데이터를 불러오지 못했습니다</div>'
          + '<div class="em-sub">' + A.esc(err && err.message ? err.message : String(err)) + '</div>'
          + '<button class="btn btn-primary" id="retry-load">다시 시도</button></div></div>';
        var btn = document.getElementById('retry-load');
        if (btn) btn.onclick = function () { A.refresh(); };
      }
    }
  };

  A.loadMonth = async function (key) {
    A.state.monthKey = key;
    try {
      var r = await A.q('load_monthly_issues', { month_key: key });
      A.state.monthly = r.rows;
      A.render();
    } catch (err) {
      console.error('[data]', err);
      A.toast('월별 이슈를 불러오지 못했습니다', 'danger');
    }
  };

  /* ---------------- shell ---------------- */
  A.renderHeader = function () {
    var el = document.getElementById('topbar');
    if (!el) return;
    var d = A.ddayInfo();
    var s = A.state.summary || {};
    var contracts = Number(s.contract_count) || 0;
    el.innerHTML =
      '<div class="brand">'
      + '<div class="brand-mark">영업</div>'
      + '<div class="brand-txt">'
      + '<h1>황윤철 팀장 영업 대시보드</h1>'
      + '<p><span class="mentor">멘토 · 박윤식 팀장</span>'
      + '<span class="dot-sep"></span>'
      + '<span>2027.04.01 목표 · 계약 3건 / 300만원</span></p>'
      + '</div></div>'
      + '<div class="top-right">'
      + '<div class="goal-chip"><span class="gc-label">4월 1일 목표</span><strong>300만원</strong></div>'
      + '<div class="dday"><b id="dday-num">' + d.label + '</b><span>남은 일수</span></div>'
      + '</div>';
  };

  A.renderTabs = function () {
    var el = document.getElementById('tabbar');
    if (!el) return;
    var n = A.state.companies.length;
    var items = [
      { key: 'dashboard', label: '대시보드' },
      { key: 'companies', label: '업체리스트', count: n },
      { key: 'resources', label: '자료' }
    ];
    el.innerHTML = items.map(function (t) {
      var active = A.state.tab === t.key ? ' active' : '';
      var count = (t.count !== undefined && t.count > 0)
        ? '<span class="tab-count">' + t.count + '</span>' : '';
      return '<button class="tab-btn' + active + '" data-tab="' + t.key + '">' + t.label + count + '</button>';
    }).join('');
    el.onclick = function (e) {
      var b = e.target.closest('[data-tab]');
      if (b) A.setTab(b.getAttribute('data-tab'));
    };
  };

  A.setTab = function (tab) {
    A.state.tab = tab;
    A.renderTabs();
    A.renderBody();
  };

  A.render = function () {
    A.renderHeader();
    A.renderTabs();
    A.renderBody();
  };

  A.renderBody = function () {
    var body = document.getElementById('tab-body');
    if (!body) return;
    if (!A.state.loaded) {
      body.innerHTML = '<div class="loading-box"><div class="spinner"></div><p>데이터를 불러오는 중…</p></div>';
      return;
    }
    body.onclick = null;
    body.onchange = null;
    body.onsubmit = null;
    body.oninput = null;
    if (A.state.tab === 'companies') A.renderCompanies(body);
    else if (A.state.tab === 'resources') A.renderResources(body);
    else A.renderDashboard(body);
  };

  /* ---------------- modal ---------------- */
  var backdrop = null;
  var modalOnClose = null;

  A.closeModal = function () {
    if (backdrop) {
      backdrop.remove();
      backdrop = null;
      document.body.classList.remove('modal-open');
    }
    var fn = modalOnClose;
    modalOnClose = null;
    if (fn) { try { fn(); } catch (e) { /* ignore */ } }
  };

  A.openModal = function (opts) {
    A.closeModal();
    modalOnClose = opts.onClose || null;
    backdrop = document.createElement('div');
    backdrop.className = 'modal-backdrop';
    backdrop.innerHTML =
      '<div class="modal' + (opts.wide ? ' modal-wide' : '') + (opts.cls ? ' ' + opts.cls : '') + '" role="dialog" aria-modal="true">'
      + '<div class="modal-head">'
      + '<div><div class="modal-title">' + A.esc(opts.title || '') + '</div>'
      + (opts.sub ? '<div class="modal-sub">' + A.esc(opts.sub) + '</div>' : '')
      + '</div>'
      + '<button class="icon-btn" data-close aria-label="닫기">✕</button>'
      + '</div>'
      + '<div class="modal-body">' + (opts.body || '') + '</div>'
      + (opts.footer ? '<div class="modal-foot">' + opts.footer + '</div>' : '')
      + '</div>';
    document.body.appendChild(backdrop);
    document.body.classList.add('modal-open');
    backdrop.addEventListener('click', function (e) {
      if (e.target === backdrop || e.target.closest('[data-close]')) A.closeModal();
    });
    return backdrop;
  };

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') A.closeModal();
  });

  /* ---------------- resource file: view / edit ---------------- */
  A.openResourceFile = async function (id) {
    var objUrl = null;
    var m = A.openModal({
      title: '자료 열람',
      sub: '불러오는 중…',
      wide: true,
      cls: 'modal-file',
      body: '<div class="loading-box"><div class="spinner"></div><p>자료를 불러오는 중…</p></div>',
      footer: '<button class="btn" data-close>닫기</button>',
      onClose: function () { if (objUrl) URL.revokeObjectURL(objUrl); }
    });
    var file = null;
    try {
      var res = await A.q('get_resource_file', { id: id });
      file = res.rows && res.rows[0];
    } catch (err) {
      console.error('[file]', err);
    }
    if (!m.isConnected) return;
    if (!file) {
      m.querySelector('.modal-body').innerHTML = '<div class="empty"><div class="em-title">자료를 열지 못했습니다</div>'
        + '<div class="em-sub">잠시 후 다시 시도해 주세요</div></div>';
      return;
    }

    var mime = file.mime_type || A.guessMime(file.file_name);
    var ext = String(file.file_name || '').split('.').pop().toLowerCase();
    var isImg = /^image\//.test(mime);
    var isPdf = mime === 'application/pdf' || ext === 'pdf';
    var isText = /^(text\/|application\/(json|xml))/.test(mime) || ['txt', 'csv', 'md'].indexOf(ext) >= 0;
    var blob = null;
    try { blob = A.dataUrlToBlob(file.data_url); } catch (e) { blob = null; }

    var bodyHtml = '';
    if (blob && isImg) {
      objUrl = URL.createObjectURL(blob);
      bodyHtml = '<div class="rv-wrap"><img class="rv-img" src="' + objUrl + '" alt="' + A.esc(file.title) + '"></div>';
    } else if (blob && isPdf) {
      objUrl = URL.createObjectURL(blob);
      bodyHtml = '<div class="rv-wrap"><iframe class="rv-frame" src="' + objUrl + '" title="' + A.esc(file.title) + '"></iframe></div>';
    } else if (blob && isText) {
      var text = '';
      try {
        text = await new Promise(function (resolve) {
          var fr = new FileReader();
          fr.onload = function () { resolve(String(fr.result || '')); };
          fr.onerror = function () { resolve(''); };
          fr.readAsText(blob);
        });
      } catch (e) { text = ''; }
      bodyHtml = '<pre class="rv-text">' + A.esc(text.slice(0, 200000)) + '</pre>';
    } else {
      var kind = A.fileKind(mime, file.file_name);
      bodyHtml = '<div class="rv-noview">'
        + '<div class="f-ico fx-' + kind + '">' + (A.fileKindLabel[kind] || 'FILE') + '</div>'
        + '<p><b>' + A.esc(file.file_name) + '</b><br>이 형식은 브라우저에서 바로 미리보기를 지원하지 않습니다.<br>아래 다운로드 버튼으로 내려받아 확인하세요.</p>'
        + '</div>';
    }
    if (file.note) {
      bodyHtml = '<p class="rv-note">' + A.esc(file.note) + '</p>' + bodyHtml;
    }

    var box = m.querySelector('.modal');
    box.querySelector('.modal-title').textContent = file.title || file.file_name;
    box.querySelector('.modal-sub').textContent =
      file.file_name + ' · ' + A.fmtSize(file.file_size) + ' · ' + (file.category || '자료') + ' · ' + A.fmtDate(file.created_at);
    box.querySelector('.modal-body').innerHTML = bodyHtml;
    var foot = box.querySelector('.modal-foot');
    foot.innerHTML = '<button class="btn" data-close>닫기</button>'
      + '<button class="btn btn-primary" id="rf-download">다운로드</button>';
    foot.querySelector('#rf-download').onclick = function () {
      try {
        A.saveBlob(blob || A.dataUrlToBlob(file.data_url), file.file_name || 'download');
        A.toast('다운로드를 시작했습니다');
      } catch (e) {
        A.toast('다운로드하지 못했습니다', 'danger');
      }
    };
  };

  A.openFileMeta = function (file) {
    var body = '<form id="rf-form" class="form-grid" autocomplete="off">'
      + '<div class="field full"><label>제목 <span class="req">*</span></label>'
      + '<input class="input" name="title" maxlength="120" value="' + A.esc(file.title) + '"></div>'
      + '<div class="field full"><label>분류</label>'
      + '<input class="input" name="category" maxlength="40" value="' + A.esc(file.category || '') + '" placeholder="예) 제안서 · 공고문 · 사업계획서"></div>'
      + '<div class="field full"><label>메모</label>'
      + '<textarea class="textarea" name="note" rows="3" placeholder="이 자료에 대한 간단한 설명">' + A.esc(file.note || '') + '</textarea></div>'
      + '<div class="field full"><div class="muted small">파일: ' + A.esc(file.file_name) + ' · ' + A.fmtSize(file.file_size)
      + ' · ' + A.fmtDate(file.created_at) + '</div></div>'
      + '</form>';
    var m = A.openModal({
      title: '자료 정보 수정',
      sub: '제목 · 분류 · 메모 (파일은 다시 올리지 않아도 됩니다)',
      body: body,
      footer: '<button class="btn" data-close>취소</button><button class="btn btn-primary" id="rf-save">저장</button>',
      wide: true
    });
    var btn = m.querySelector('#rf-save');
    m.querySelector('#rf-form').onsubmit = function (e) { e.preventDefault(); btn.click(); };
    btn.onclick = async function () {
      var f = m.querySelector('#rf-form');
      var title = f.querySelector('[name=title]').value.trim();
      if (!title) { A.toast('제목을 입력하세요', 'warn'); return; }
      btn.disabled = true;
      try {
        await A.q('update_resource_file', {
          id: file.id,
          title: title,
          category: f.querySelector('[name=category]').value.trim() || '자료',
          note: f.querySelector('[name=note]').value.trim() || null
        });
        A.closeModal();
        A.toast('자료 정보를 수정했습니다');
        await A.refresh();
      } catch (err) {
        console.error('[error]', err);
        btn.disabled = false;
        A.toast('저장하지 못했습니다', 'danger');
      }
    };
  };

  /* ---------------- boot ---------------- */
  A.boot = function () {
    var content = document.getElementById('content');
    if (!content) return;
    console.log('[init] boot dashboard');

    /* Paperlogy must win over the kit's font stack regardless of injection order */
    var st = document.createElement('style');
    st.textContent = "html body, html body * { font-family: 'Paperlogy','Pretendard',-apple-system,BlinkMacSystemFont,'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif !important; }";
    document.head.appendChild(st);
    if (document.fonts && document.fonts.load) {
      document.fonts.load('700 16px Paperlogy').then(function () {
        console.log('[font] Paperlogy ready');
      }).catch(function () {
        console.warn('[font] Paperlogy failed, using fallback stack');
      });
    }

    content.innerHTML =
      '<div class="shell">'
      + '<header class="topbar" id="topbar"></header>'
      + '<nav class="tabbar" id="tabbar"></nav>'
      + '<main id="tab-body" class="tab-body">'
      + '<div class="loading-box"><div class="spinner"></div><p>데이터를 불러오는 중…</p></div>'
      + '</main>'
      + '<footer class="foot">황윤철 팀장 · 멘토 박윤식 팀장 &nbsp;|&nbsp; 2027년 4월 1일까지 계약 3건 · 300만원<br>업체 1건당 미팅 7건 / 매일 미팅 약속 전화 1건</footer>'
      + '</div>';

    A.renderHeader();
    A.renderTabs();
    A.refresh();

    setInterval(function () {
      var n = document.getElementById('dday-num');
      if (n) n.textContent = A.ddayInfo().label;
    }, 60000);
  };
})();

</script>
<script>
/* =========================================================
   ① 대시보드 — 목표 / 3개월 달력 / 오늘 할 일 / 월별 이슈 / 진행리스트
   ========================================================= */
(function () {
  'use strict';
  var A = window.App;
  var DOW = ['일', '월', '화', '수', '목', '금', '토'];

  function gauge(label, valueHtml, pct, sub, tone) {
    return '<div class="gauge">'
      + '<div class="gauge-top"><span class="gauge-label">' + label + '</span>'
      + '<span class="gauge-val">' + valueHtml + '</span></div>'
      + '<div class="bar"><i class="' + (tone || '') + '" style="width:' + Math.max(0, Math.min(100, pct)) + '%"></i></div>'
      + '<div class="gauge-sub">' + sub + '</div>'
      + '</div>';
  }

  function monthHtml(m, todayISO, evMap) {
    var y = Number(m.key.slice(0, 4));
    var mo = Number(m.key.slice(5, 7));
    var startDow = new Date(y, mo - 1, 1).getDay();
    var daysInMonth = new Date(y, mo, 0).getDate();
    var cells = '';
    var total = 0;
    var i;

    for (i = 0; i < startDow; i++) cells += '<span class="day out"></span>';

    for (var d = 1; d <= daysInMonth; d++) {
      var iso = y + '-' + A.pad(mo) + '-' + A.pad(d);
      var evs = evMap[iso] || [];
      total += evs.length;
      var dow = new Date(y, mo - 1, d).getDay();
      var cls = 'day';
      if (dow === 0) cls += ' sun';
      if (dow === 6) cls += ' sat';
      if (iso === todayISO) cls += ' today';

      var seen = {};
      var dots = '';
      evs.forEach(function (e) {
        var dc;
        if (e.kind === 'activity') dc = e.sub === 'meeting' ? 'd-meet' : 'd-call';
        else if (e.kind === 'todo') dc = 'd-todo';
        else dc = 'd-log';
        if (seen[dc]) return;
        seen[dc] = 1;
        dots += '<i class="' + dc + '"></i>';
      });

      cells += '<button class="' + cls + '" data-date="' + iso + '" title="' + iso + '">'
        + '<span class="dnum">' + d + '</span>'
        + '<span class="dots">' + dots + '</span>'
        + '</button>';
    }

    return '<div class="month">'
      + '<div class="month-title"><span>' + m.label + '</span>'
      + '<span class="month-count' + (total ? '' : ' zero') + '">' + total + '건</span></div>'
      + '<div class="dow">' + DOW.map(function (w, idx) {
        return '<span class="' + (idx === 0 ? 'sun' : idx === 6 ? 'sat' : '') + '">' + w + '</span>';
      }).join('') + '</div>'
      + '<div class="days">' + cells + '</div>'
      + '</div>';
  }

  A.renderDashboard = function (body) {
    var s = A.state.summary || {};
    var companies = A.state.companies || [];
    var todayISO = A.todayISO();
    var d = A.ddayInfo();

    var contracts = Number(s.contract_count) || 0;
    var amount = Number(s.contract_amount) || 0;
    var meetings = Number(s.meetings) || 0;
    var calls = Number(s.calls) || 0;
    var callsToday = Number(s.calls_today) || 0;
    var companyCount = Number(s.company_count) || 0;
    var meetTarget = companyCount * A.C.MEET_PER_COMPANY;
    var meetPct = A.pct(meetings, meetTarget);

    var html = '';

    /* ---- hero ---- */
    html += '<section class="hero">'
      + '<div>'
      + '<div class="hero-eyebrow">FINAL GOAL · 2027.04.01</div>'
      + '<h2 class="hero-title">4월 1일 목표 <em>300만원</em></h2>'
      + '<p class="hero-sub">계약 3건 이상 · 총 계약금액 300만원 이상 달성</p>'
      + '<div class="hero-pills">'
      + '<span class="hero-pill">계약 <strong>' + contracts + ' / 3건</strong></span>'
      + '<span class="hero-pill">계약금액 <strong>' + A.won(amount) + ' / ' + A.won(A.C.GOAL_AMOUNT) + '</strong></span>'
      + '<span class="hero-pill">등록 업체 <strong>' + companyCount + '곳</strong></span>'
      + '</div>'
      + '</div>'
      + '<div class="dday"><b>' + d.label + '</b><span>목표까지 ' + Math.max(0, d.diff) + '일</span></div>'
      + '</section>';

    /* ---- goal gauges ---- */
    html += '<section class="card perf">'
      + '<div class="perf-head">'
      + '<div><div class="card-title">목표 대비 실적</div>'
      + '<div class="card-sub">영업 성공 공식 — 업체 1건당 미팅 7건 / 매일 미팅 약속 전화 1건</div></div>'
      + '<div class="formula"><span>업체 <b>1</b></span><span class="f-eq">×</span><span>미팅 <b>7</b></span><span class="f-eq">=</span><span>미팅 <b>7</b>건</span></div>'
      + '</div>'
      + '<div class="gauges">'
      + gauge('계약 건수', contracts + '<span class="unit">/ 3건</span>', A.pct(contracts, 3),
        '목표 3건 · 달성 ' + A.pct(contracts, 3) + '%', contracts >= 3 ? 'ok' : '')
      + gauge('계약 금액', A.won(amount), A.pct(amount, A.C.GOAL_AMOUNT),
        '목표 300만원 · 달성 ' + A.pct(amount, A.C.GOAL_AMOUNT) + '%', amount >= A.C.GOAL_AMOUNT ? 'ok' : '')
      + gauge('누적 미팅', meetings + '<span class="unit">/ ' + meetTarget + '건</span>', meetPct,
        '업체 ' + companyCount + '곳 × 7건 · ' + meetPct + '%', meetPct >= 100 ? 'ok' : '')
      + gauge('오늘 전화', callsToday + '<span class="unit">/ 1건</span>', callsToday > 0 ? 100 : 0,
        '누적 ' + calls + '건 · 1일 1건 권장', callsToday > 0 ? 'ok' : 'warn')
      + '</div>'
      + '</section>';

    /* ---- calendar ---- */
    var groups = [A.C.MONTHS.slice(0, 3), A.C.MONTHS.slice(3, 6)];
    var shown = groups[A.state.calGroup] || groups[0];
    html += '<section class="card">'
      + '<div class="card-head">'
      + '<div><div class="card-title">영업 캘린더</div>'
      + '<div class="card-sub">날짜를 클릭하면 그날의 일정 · 미팅 · 전화를 기록할 수 있습니다</div></div>'
      + '<div class="seg">'
      + '<button class="seg-btn' + (A.state.calGroup === 0 ? ' active' : '') + '" data-cal-group="0">11월 – 1월</button>'
      + '<button class="seg-btn' + (A.state.calGroup === 1 ? ' active' : '') + '" data-cal-group="1">2월 – 4월</button>'
      + '</div></div>'
      + '<div class="cal-legend">'
      + '<span><i class="legend-dot d-meet"></i>미팅</span>'
      + '<span><i class="legend-dot d-call"></i>전화</span>'
      + '<span><i class="legend-dot d-todo"></i>할 일</span>'
      + '<span><i class="legend-dot d-log"></i>진행기록</span>'
      + '</div>'
      + '<div class="cal-wrap"><div class="cal-grid">'
      + shown.map(function (m) { return monthHtml(m, todayISO, A.state.evMap); }).join('')
      + '</div></div>'
      + '</section>';

    /* ---- today + monthly ---- */
    var todays = (A.state.evMap[todayISO] || []).filter(function (r) { return r.kind === 'todo'; });
    var doneCount = todays.filter(function (t) { return t.is_done; }).length;

    html += '<div class="split">';

    html += '<section class="card">'
      + '<div class="card-head"><div>'
      + '<div class="card-title">오늘 할 일 <span class="count-pill">' + doneCount + '/' + todays.length + '</span></div>'
      + '<div class="card-sub">' + A.fmtDateKo(todayISO) + ' · 미팅 / 전화 / 이슈체크</div>'
      + '</div></div>'
      + '<div class="card-body">'
      + '<form class="inline-form" id="todo-form">'
      + '<select class="select" name="kind">' + A.options(A.C.KINDS, '미팅') + '</select>'
      + '<input class="input" name="title" placeholder="할 일을 입력하고 Enter" maxlength="200">'
      + '<button class="btn btn-primary" type="submit">추가</button>'
      + '</form>'
      + '<ul class="todo-list">'
      + (todays.length ? todays.map(function (t) {
        return '<li class="todo' + (t.is_done ? ' done' : '') + '" data-todo-id="' + t.id + '">'
          + '<input type="checkbox" data-todo-check' + (t.is_done ? ' checked' : '') + '>'
          + '<span class="kdot ' + A.esc(t.sub) + '"></span>'
          + '<span class="txt">' + A.esc(t.title) + '</span>'
          + '<span class="ktag">' + A.esc(t.sub) + '</span>'
          + '<button class="icon-btn tiny" data-todo-del="' + t.id + '" aria-label="삭제">✕</button>'
          + '</li>';
      }).join('') : '<li class="day-empty">오늘 할 일이 없습니다. 위에서 추가해 보세요.</li>')
      + '</ul>'
      + '</div></section>';

    var mk = A.state.monthKey;
    var mkLabel = (A.C.MONTHS.filter(function (m) { return m.key === mk; })[0] || { label: mk }).label;
    var mDone = A.state.monthly.filter(function (m) { return m.done; }).length;

    html += '<section class="card">'
      + '<div class="card-head"><div>'
      + '<div class="card-title">월별 이슈 체크 <span class="count-pill">' + mDone + '/' + A.state.monthly.length + '</span></div>'
      + '<div class="card-sub">' + mkLabel + ' · 챙겨야 할 이슈를 체크하고 (+)로 계속 추가</div>'
      + '</div></div>'
      + '<div class="card-body">'
      + '<div class="mpills">' + A.C.MONTHS.map(function (m) {
        return '<button class="mpill' + (m.key === mk ? ' active' : '') + '" data-mkey="' + m.key + '">' + m.short + '</button>';
      }).join('') + '</div>'
      + '<ul class="missues">'
      + (A.state.monthly.length ? A.state.monthly.map(function (m) {
        return '<li class="missue' + (m.done ? ' done' : '') + '" data-m-id="' + m.id + '">'
          + '<button class="mi-check" data-m-check="' + m.id + '" aria-label="완료">✓</button>'
          + '<span class="mtxt">' + A.esc(m.title) + '</span>'
          + '<button class="icon-btn tiny" data-m-del="' + m.id + '" aria-label="삭제">✕</button>'
          + '</li>';
      }).join('') : '<li class="day-empty">이 달의 이슈가 없습니다. 아래 (+)로 추가하세요.</li>')
      + '</ul>'
      + '<form class="add-row" id="month-form">'
      + '<input class="input" name="title" placeholder="이슈 항목 추가 (예: 수출바우처)" maxlength="100">'
      + '<button class="add-plus" type="submit" aria-label="추가">+</button>'
      + '</form>'
      + '</div></section>';

    html += '</div>'; /* split */

    /* ---- progress list ---- */
    html += '<section class="card">'
      + '<div class="card-head"><div>'
      + '<div class="card-title">업체별 진행리스트 <span class="count-pill">' + companies.length + '</span></div>'
      + '<div class="card-sub">업체리스트와 실시간 연동 · 미팅 / 전화 / 이슈 / 진행률</div>'
      + '</div>'
      + '<button class="btn btn-sm" data-goto-companies>업체 관리 →</button>'
      + '</div>'
      + '<div class="table-wrap"><table class="tbl tbl-prog">'
      + '<thead><tr><th>업체명</th><th>상태</th><th>미팅</th><th>전화</th><th>이슈</th><th style="min-width:132px">진행률</th></tr></thead>'
      + '<tbody>';

    if (!companies.length) {
      html += '<tr><td colspan="6"><div class="empty">'
        + '<div class="em-icon">＋</div>'
        + '<div class="em-title">아직 등록된 업체가 없습니다</div>'
        + '<div class="em-sub">업체리스트 탭에서 첫 업체를 추가하면<br>미팅 · 전화 · 진행률이 이 표에 바로 반영됩니다.</div>'
        + '<button class="btn btn-primary" data-goto-companies>첫 업체 추가하기</button>'
        + '</div></td></tr>';
    } else {
      companies.forEach(function (c) {
        var p = A.progressOf(c);
        html += '<tr class="rowlink" data-open-company="' + c.id + '">'
          + '<td><div class="co-name">' + A.esc(c.name) + '</div>'
          + '<div class="co-sub">' + A.esc(c.ceo || '대표 미입력') + (c.region ? ' · ' + A.esc(c.region) : '') + '</div></td>'
          + '<td>' + A.statusBadge(c.status) + '</td>'
          + '<td class="num">' + (Number(c.meetings) || 0) + '<span class="muted"> / 7</span></td>'
          + '<td class="num">' + (Number(c.calls) || 0) + '<span class="muted">건</span></td>'
          + '<td><div class="chips">' + A.issueChips(A.issuesOf(c), 2) + '</div></td>'
          + '<td><div class="prog-cell"><div class="bar sm"><i class="' + (p >= 100 ? 'ok' : '') + '" style="width:' + p + '%"></i></div><b>' + p + '%</b></div></td>'
          + '</tr>';
      });
    }
    html += '</tbody></table></div></section>';

    body.innerHTML = html;
    bindDashboard(body);
  };

  /* ---------------- dashboard events ---------------- */
  function bindDashboard(body) {
    body.onclick = async function (e) {
      var calGroup = e.target.closest('[data-cal-group]');
      if (calGroup) {
        A.state.calGroup = Number(calGroup.getAttribute('data-cal-group'));
        A.renderDashboard(body);
        return;
      }

      var day = e.target.closest('[data-date]');
      if (day) { A.openDay(day.getAttribute('data-date')); return; }

      var goto = e.target.closest('[data-goto-companies]');
      if (goto) { A.setTab('companies'); return; }

      var openCo = e.target.closest('[data-open-company]');
      if (openCo) { A.openCompanyDetail(Number(openCo.getAttribute('data-open-company'))); return; }

      var mkey = e.target.closest('[data-mkey]');
      if (mkey) { A.loadMonth(mkey.getAttribute('data-mkey')); return; }

      var mcheck = e.target.closest('[data-m-check]');
      if (mcheck) {
        var id = Number(mcheck.getAttribute('data-m-check'));
        var item = A.state.monthly.filter(function (x) { return x.id === id; })[0];
        if (!item) return;
        try {
          await A.q('set_monthly_issue_done', { id: id, done: !item.done });
          await A.refresh();
        } catch (err) { console.error('[error]', err); A.toast('저장하지 못했습니다', 'danger'); }
        return;
      }

      var mdel = e.target.closest('[data-m-del]');
      if (mdel) {
        if (!(await A.confirm('이 이슈 항목을 삭제할까요?'))) return;
        try {
          await A.q('delete_monthly_issue', { id: Number(mdel.getAttribute('data-m-del')) });
          await A.refresh();
        } catch (err) { console.error('[error]', err); A.toast('삭제하지 못했습니다', 'danger'); }
        return;
      }

      var tdel = e.target.closest('[data-todo-del]');
      if (tdel) {
        try {
          await A.q('delete_todo', { id: Number(tdel.getAttribute('data-todo-del')) });
          await A.refresh();
        } catch (err) { console.error('[error]', err); A.toast('삭제하지 못했습니다', 'danger'); }
      }
    };

    body.onchange = async function (e) {
      if (e.target.matches('[data-todo-check]')) {
        var li = e.target.closest('[data-todo-id]');
        try {
          await A.q('set_todo_done', { id: Number(li.getAttribute('data-todo-id')), done: e.target.checked });
          await A.refresh();
        } catch (err) { console.error('[error]', err); A.toast('저장하지 못했습니다', 'danger'); }
      }
    };

    body.onsubmit = async function (e) {
      var f = e.target;
      if (f.id === 'todo-form') {
        e.preventDefault();
        var title = f.querySelector('[name=title]').value.trim();
        if (!title) return;
        var kind = f.querySelector('[name=kind]').value;
        try {
          await A.q('insert_todo', { todo_date: A.todayISO(), kind: kind, title: title });
          await A.refresh();
        } catch (err) { console.error('[error]', err); A.toast('추가하지 못했습니다', 'danger'); }
      }
      if (f.id === 'month-form') {
        e.preventDefault();
        var t = f.querySelector('[name=title]').value.trim();
        if (!t) return;
        try {
          await A.q('insert_monthly_issue', { month_key: A.state.monthKey, title: t });
          await A.refresh();
        } catch (err) { console.error('[error]', err); A.toast('추가하지 못했습니다', 'danger'); }
      }
    };
  }

  /* ---------------- day modal ---------------- */
  function dayBody(rows, dateStr) {
    var todos = rows.filter(function (r) { return r.kind === 'todo'; });
    var acts = rows.filter(function (r) { return r.kind === 'activity'; });
    var logs = rows.filter(function (r) { return r.kind === 'log'; });

    var html = '';

    html += '<div class="day-sec">'
      + '<div class="mini-title">할 일 <span class="count-pill">' + todos.length + '</span></div>'
      + '<form class="inline-form" id="day-todo-form">'
      + '<select class="select" name="kind">' + A.options(A.C.KINDS, '미팅') + '</select>'
      + '<input class="input" name="title" placeholder="할 일 입력" maxlength="200">'
      + '<button class="btn btn-primary" type="submit">추가</button>'
      + '</form>'
      + '<ul class="todo-list">'
      + (todos.length ? todos.map(function (t) {
        return '<li class="todo' + (t.is_done ? ' done' : '') + '" data-todo-id="' + t.id + '">'
          + '<input type="checkbox" data-todo-check' + (t.is_done ? ' checked' : '') + '>'
          + '<span class="kdot ' + A.esc(t.sub) + '"></span>'
          + '<span class="txt">' + A.esc(t.title) + '</span>'
          + '<span class="ktag">' + A.esc(t.sub) + '</span>'
          + '<button class="icon-btn tiny" data-todo-del="' + t.id + '" aria-label="삭제">✕</button>'
          + '</li>';
      }).join('') : '<li class="day-empty">기록된 할 일이 없습니다.</li>')
      + '</ul></div>';

    var coOpts = '<option value="">업체 미지정</option>' + A.state.companies.map(function (c) {
      return '<option value="' + c.id + '">' + A.esc(c.name) + '</option>';
    }).join('');

    html += '<div class="day-sec">'
      + '<div class="mini-title">미팅 · 전화 기록 <span class="count-pill">' + acts.length + '</span></div>'
      + '<form class="inline-form" id="day-act-form">'
      + '<select class="select" name="act_type"><option value="meeting">미팅</option><option value="call">전화</option></select>'
      + '<select class="select" name="company_id" style="min-width:140px">' + coOpts + '</select>'
      + '<input class="input" name="content" placeholder="내용 (선택)" maxlength="200">'
      + '<button class="btn btn-primary" type="submit">추가</button>'
      + '</form>'
      + '<ul class="mini-list">'
      + (acts.length ? acts.map(function (a) {
        return '<li class="mini-item">'
          + '<span class="mi-type ' + (a.sub === 'meeting' ? 'meeting' : 'call') + '">' + (a.sub === 'meeting' ? '미팅' : '전화') + '</span>'
          + '<span class="mi-txt">' + A.esc(a.title) + (a.detail ? ' — ' + A.esc(a.detail) : '') + '</span>'
          + '<button class="icon-btn tiny" data-act-del="' + a.id + '" aria-label="삭제">✕</button>'
          + '</li>';
      }).join('') : '<li class="day-empty">기록된 미팅 · 전화가 없습니다.</li>')
      + '</ul></div>';

    html += '<div class="day-sec">'
      + '<div class="mini-title">업체 진행기록 <span class="count-pill">' + logs.length + '</span></div>'
      + '<ul class="mini-list">'
      + (logs.length ? logs.map(function (l) {
        return '<li class="mini-item">'
          + '<span class="mi-type call">기록</span>'
          + '<span class="mi-txt"><b>' + A.esc(l.title) + '</b> — ' + A.esc(l.detail) + '</span>'
          + '</li>';
      }).join('') : '<li class="day-empty">이 날짜에 쌓인 진행기록은 없습니다.</li>')
      + '</ul></div>';

    return html;
  }

  async function refreshDay(m, dateStr) {
    if (!document.body.contains(m)) return;
    var res = await A.q('load_day', { d: dateStr });
    var bodyEl = m.querySelector('.modal-body');
    if (!bodyEl) return;
    bodyEl.innerHTML = dayBody(res.rows, dateStr);
    bindDay(m, dateStr);
  }

  function bindDay(m, dateStr) {
    m.onclick = async function (e) {
      var tdel = e.target.closest('[data-todo-del]');
      if (tdel) {
        try {
          await A.q('delete_todo', { id: Number(tdel.getAttribute('data-todo-del')) });
          await A.loadAll(); A.render(); await refreshDay(m, dateStr);
        } catch (err) { console.error('[error]', err); A.toast('삭제하지 못했습니다', 'danger'); }
        return;
      }
      var adel = e.target.closest('[data-act-del]');
      if (adel) {
        try {
          await A.q('delete_activity', { id: Number(adel.getAttribute('data-act-del')) });
          await A.loadAll(); A.render(); await refreshDay(m, dateStr);
        } catch (err) { console.error('[error]', err); A.toast('삭제하지 못했습니다', 'danger'); }
      }
    };

    m.onchange = async function (e) {
      if (e.target.matches('[data-todo-check]')) {
        var li = e.target.closest('[data-todo-id]');
        try {
          await A.q('set_todo_done', { id: Number(li.getAttribute('data-todo-id')), done: e.target.checked });
          await A.loadAll(); A.render(); await refreshDay(m, dateStr);
        } catch (err) { console.error('[error]', err); A.toast('저장하지 못했습니다', 'danger'); }
      }
    };

    m.onsubmit = async function (e) {
      e.preventDefault();
      var f = e.target;
      if (f.id === 'day-todo-form') {
        var title = f.querySelector('[name=title]').value.trim();
        if (!title) return;
        try {
          await A.q('insert_todo', {
            todo_date: dateStr,
            kind: f.querySelector('[name=kind]').value,
            title: title
          });
          await A.loadAll(); A.render(); await refreshDay(m, dateStr);
        } catch (err) { console.error('[error]', err); A.toast('추가하지 못했습니다', 'danger'); }
      }
      if (f.id === 'day-act-form') {
        var cid = f.querySelector('[name=company_id]').value;
        try {
          await A.q('insert_activity', {
            company_id: cid ? Number(cid) : null,
            act_type: f.querySelector('[name=act_type]').value,
            act_date: dateStr,
            content: f.querySelector('[name=content]').value.trim() || null
          });
          await A.loadAll(); A.render(); await refreshDay(m, dateStr);
        } catch (err) { console.error('[error]', err); A.toast('추가하지 못했습니다', 'danger'); }
      }
    };
  }

  A.openDay = async function (dateStr) {
    console.log('[render] day', dateStr);
    var res;
    try {
      res = await A.q('load_day', { d: dateStr });
    } catch (err) {
      console.error('[error]', err);
      A.toast('해당 날짜를 불러오지 못했습니다', 'danger');
      return;
    }
    var m = A.openModal({
      title: A.fmtDateKo(dateStr),
      sub: '일정 · 미팅 · 전화 · 진행기록',
      body: dayBody(res.rows, dateStr),
      wide: true
    });
    bindDay(m, dateStr);
  };
})();

</script>
<script>
/* =========================================================
   ② 업체리스트 — 관리기업 목록 / 진행사항 누적 / 미팅·전화 기록
   ========================================================= */
(function () {
  'use strict';
  var A = window.App;

  A.filteredCompanies = function () {
    var f = A.state.filters;
    var q = String(f.q || '').trim().toLowerCase();
    return A.state.companies.filter(function (c) {
      if (f.region && c.region !== f.region) return false;
      if (f.status && c.status !== f.status) return false;
      if (q) {
        var hay = [c.name, c.ceo, c.phone, c.address].join(' ').toLowerCase();
        if (hay.indexOf(q) < 0) return false;
      }
      return true;
    });
  };

  function rowHtml(c) {
    var p = A.progressOf(c);
    return '<tr class="rowlink" data-open-company="' + c.id + '">'
      + '<td><div class="co-name">' + A.esc(c.name) + '</div>'
      + '<div class="co-sub">' + A.esc(c.ceo || '대표 미입력') + '</div></td>'
      + '<td>' + (c.region ? A.esc(c.region) : '<span class="muted">-</span>') + '</td>'
      + '<td class="co-sub" style="font-size:12px">' + A.esc(c.phone || '-') + '</td>'
      + '<td><div class="chips">' + A.issueChips(A.issuesOf(c), 3) + '</div></td>'
      + '<td>' + A.statusBadge(c.status) + '</td>'
      + '<td class="num" style="white-space:nowrap">' + (Number(c.meetings) || 0) + '<span class="muted"> / 7</span>'
      + '<span class="muted" style="margin:0 4px">·</span>' + (Number(c.calls) || 0) + '<span class="muted">건</span></td>'
      + '<td class="money' + ((Number(c.expected_amount) || 0) === 0 ? ' zero' : '') + '" style="white-space:nowrap">' + A.won(c.expected_amount) + '</td>'
      + '<td><div class="prog-cell"><div class="bar sm"><i class="' + (p >= 100 ? 'ok' : '') + '" style="width:' + p + '%"></i></div><b>' + p + '%</b></div></td>'
      + '<td style="white-space:nowrap;text-align:right">'
      + '<button class="icon-btn tiny" data-edit-company="' + c.id + '" aria-label="수정">✎</button>'
      + '<button class="icon-btn tiny" data-del-company="' + c.id + '" aria-label="삭제">✕</button>'
      + '</td></tr>';
  }

  function renderRows() {
    var tb = document.getElementById('company-tbody');
    if (!tb) return;
    var rows = A.filteredCompanies();
    var countEl = document.getElementById('co-count');
    if (countEl) countEl.textContent = rows.length;
    var totalEl = document.getElementById('co-total');
    if (totalEl) totalEl.textContent = A.state.companies.length;

    if (!rows.length) {
      tb.innerHTML = '<tr><td colspan="9"><div class="empty">'
        + '<div class="em-icon">＋</div>'
        + '<div class="em-title">' + (A.state.companies.length ? '조건에 맞는 업체가 없습니다' : '아직 등록된 업체가 없습니다') + '</div>'
        + '<div class="em-sub">' + (A.state.companies.length
          ? '검색어나 필터를 바꿔 보세요.'
          : '업체를 추가하면 이슈별 예상 계약금액과 미팅 7건 목표 달성률이 자동으로 계산됩니다.') + '</div>'
        + (A.state.companies.length ? '<button class="btn" id="co-clear">필터 초기화</button>'
          : '<button class="btn btn-primary" data-add-company>+ 첫 업체 추가</button>')
        + '</div></td></tr>';
      return;
    }
    tb.innerHTML = rows.map(rowHtml).join('');
  }

  A.renderCompanies = function (body) {
    var f = A.state.filters;
    var regions = '<option value="">지역 전체</option>' + A.options(A.C.REGIONS, f.region);
    var statuses = '<option value="">상태 전체</option>' + A.options(A.C.STATUSES, f.status);

    body.innerHTML = '<section class="card">'
      + '<div class="card-head">'
      + '<div><div class="card-title">관리기업 리스트 <span class="count-pill" id="co-count">' + A.filteredCompanies().length + '</span></div>'
      + '<div class="card-sub">전체 <b id="co-total">' + A.state.companies.length + '</b>곳 · 이슈를 다중 선택하면 예상 계약금액이 자동 합산됩니다</div></div>'
      + '<button class="btn btn-primary" data-add-company>+ 업체 추가</button>'
      + '</div>'
      + '<div class="toolbar">'
      + '<div class="search"><input class="input" id="co-search" placeholder="업체명 · 대표이사 · 연락처 검색" value="' + A.esc(f.q) + '"></div>'
      + '<select class="select" id="co-region">' + regions + '</select>'
      + '<select class="select" id="co-status">' + statuses + '</select>'
      + '<button class="btn btn-ghost btn-sm" id="co-reset">초기화</button>'
      + '</div>'
      + '<div class="scroll-hint">← 표를 좌우로 넘기면 모든 항목이 보입니다</div>'
      + '<div class="table-wrap"><table class="tbl tbl-co">'
      + '<thead><tr><th>업체명</th><th>지역</th><th>연락처</th><th>이슈</th><th>상태</th><th>미팅 · 전화</th><th>예상금액</th><th style="min-width:120px">진행률</th><th></th></tr></thead>'
      + '<tbody id="company-tbody"></tbody>'
      + '</table></div>'
      + '</section>';

    renderRows();
    bindList(body);
  };

  function bindList(body) {
    body.onclick = function (e) {
      if (e.target.closest('[data-add-company]')) { A.openCompanyForm(null); return; }
      if (e.target.closest('#co-clear')) {
        A.state.filters = { q: '', region: '', status: '' };
        A.renderCompanies(body);
        return;
      }
      if (e.target.closest('#co-reset')) {
        A.state.filters = { q: '', region: '', status: '' };
        A.renderCompanies(body);
        return;
      }
      var edit = e.target.closest('[data-edit-company]');
      if (edit) {
        var id = Number(edit.getAttribute('data-edit-company'));
        var c = A.state.companies.filter(function (x) { return x.id === id; })[0];
        if (c) A.openCompanyForm(c);
        return;
      }
      var del = e.target.closest('[data-del-company]');
      if (del) {
        var did = Number(del.getAttribute('data-del-company'));
        var dc = A.state.companies.filter(function (x) { return x.id === did; })[0];
        if (!dc) return;
        A.confirm('"' + dc.name + '" 업체와 진행기록 · 미팅/전화 기록을 모두 삭제할까요?').then(async function (ok) {
          if (!ok) return;
          try {
            await A.q('delete_company', { id: did });
            A.toast('업체를 삭제했습니다');
            await A.refresh();
          } catch (err) { console.error('[error]', err); A.toast('삭제하지 못했습니다', 'danger'); }
        });
        return;
      }
      var row = e.target.closest('[data-open-company]');
      if (row) A.openCompanyDetail(Number(row.getAttribute('data-open-company')));
    };

    body.oninput = function (e) {
      if (e.target.id === 'co-search') {
        A.state.filters.q = e.target.value;
        renderRows();
      }
    };

    body.onchange = function (e) {
      if (e.target.id === 'co-region') { A.state.filters.region = e.target.value; renderRows(); }
      if (e.target.id === 'co-status') { A.state.filters.status = e.target.value; renderRows(); }
    };
  }

  /* ---------------- add / edit form ---------------- */
  A.openCompanyForm = function (company) {
    var edit = !!company;
    var selected = A.issuesOf(company || {});
    var groups = {};
    A.state.issues.forEach(function (it) {
      (groups[it.category] = groups[it.category] || []).push(it);
    });

    var picker = A.C.CAT_ORDER.filter(function (cat) { return groups[cat]; }).map(function (cat) {
      var items = groups[cat];
      return '<div class="issue-group">'
        + '<div class="ig-head"><span class="chip ' + A.C.CAT_COLOR[cat] + '">' + cat + '</span>'
        + '<span class="ig-amt">건당 ' + A.won(items[0].amount) + '</span></div>'
        + '<div class="ig-chips">' + items.map(function (it) {
          return '<button type="button" class="pick' + (selected.indexOf(it.name) >= 0 ? ' on' : '') + '" data-pick="' + A.esc(it.name) + '">' + A.esc(it.name) + '</button>';
        }).join('') + '</div></div>';
    }).join('');

    var body = '<form id="company-form" class="form-grid" autocomplete="off">'
      + '<div class="field full"><label>업체명 <span class="req">*</span></label>'
      + '<input class="input" name="name" placeholder="예) ○○정밀" maxlength="100" value="' + A.esc(company ? company.name : '') + '"></div>'
      + '<div class="field"><label>지역</label><select class="select" name="region">'
      + '<option value="">선택 안 함</option>' + A.options(A.C.REGIONS, company ? company.region : '') + '</select></div>'
      + '<div class="field"><label>상태</label><select class="select" name="status">'
      + A.options(A.C.STATUSES, company ? company.status : '신규') + '</select></div>'
      + '<div class="field"><label>대표이사명</label><input class="input" name="ceo" maxlength="60" value="' + A.esc(company ? company.ceo : '') + '" placeholder="홍길동"></div>'
      + '<div class="field"><label>연락처</label><input class="input" name="phone" maxlength="40" value="' + A.esc(company ? company.phone : '') + '" placeholder="010-0000-0000"></div>'
      + '<div class="field full"><label>상세주소</label><input class="input" name="address" maxlength="200" value="' + A.esc(company ? company.address : '') + '" placeholder="예) 서울시 금천구 디지털로 123, 4층"></div>'
      + '<div class="field full"><label>이슈 <span class="hint">다중 선택 → 예상 계약금액 자동 합산</span></label>'
      + '<div class="issue-groups" id="issue-picker">' + picker + '</div>'
      + '<div class="amount-box"><div><span class="ab-label">예상 계약금액</span>'
      + '<span class="ab-count" id="pick-count">선택 0건</span></div>'
      + '<strong id="pick-amount">0원</strong></div></div>'
      + '<div class="field full"><label>메모</label><textarea class="textarea" name="memo" rows="3" maxlength="1000" placeholder="상담 시 참고할 내용">' + A.esc(company ? company.memo : '') + '</textarea></div>'
      + '</form>';

    var footer = '<button class="btn" data-close>취소</button>'
      + '<button class="btn btn-primary" id="company-save">' + (edit ? '수정 저장' : '업체 추가') + '</button>';

    var m = A.openModal({
      title: edit ? '업체 수정' : '업체 추가',
      sub: edit ? company.name : '기본 정보와 이슈를 입력하세요',
      body: body,
      footer: footer,
      wide: true
    });

    function refreshAmount() {
      var total = selected.reduce(function (s, n) {
        var t = A.state.issueMap[n];
        return s + (t ? Number(t.amount) || 0 : 0);
      }, 0);
      m.querySelector('#pick-amount').textContent = A.won(total);
      m.querySelector('#pick-count').textContent = '선택 ' + selected.length + '건';
    }
    refreshAmount();

    m.querySelector('#issue-picker').onclick = function (e) {
      var btn = e.target.closest('[data-pick]');
      if (!btn) return;
      var name = btn.getAttribute('data-pick');
      var idx = selected.indexOf(name);
      if (idx >= 0) { selected.splice(idx, 1); btn.classList.remove('on'); }
      else { selected.push(name); btn.classList.add('on'); }
      refreshAmount();
    };

    var saveBtn = m.querySelector('#company-save');
    m.querySelector('#company-form').onsubmit = function (e) {
      e.preventDefault();
      saveBtn.click();
    };
    saveBtn.onclick = async function () {
      var form = m.querySelector('#company-form');
      var payload = {
        name: form.querySelector('[name=name]').value.trim(),
        region: form.querySelector('[name=region]').value || null,
        address: form.querySelector('[name=address]').value.trim() || null,
        ceo: form.querySelector('[name=ceo]').value.trim() || null,
        phone: form.querySelector('[name=phone]').value.trim() || null,
        issues: selected.join(','),
        status: form.querySelector('[name=status]').value,
        memo: form.querySelector('[name=memo]').value.trim() || null
      };
      if (!payload.name) {
        A.toast('업체명을 입력하세요', 'warn');
        form.querySelector('[name=name]').focus();
        return;
      }
      saveBtn.disabled = true;
      try {
        if (edit) {
          payload.id = company.id;
          await A.q('update_company', payload);
        } else {
          await A.q('insert_company', payload);
        }
        A.closeModal();
        A.toast(edit ? '업체 정보를 수정했습니다' : '업체를 추가했습니다');
        await A.refresh();
      } catch (err) {
        console.error('[error]', err);
        saveBtn.disabled = false;
        A.toast('저장하지 못했습니다: ' + (err && err.message ? err.message : ''), 'danger');
      }
    };

    var nameInput = m.querySelector('[name=name]');
    if (nameInput) nameInput.focus();
  };

  /* ---------------- detail ---------------- */
  function detailBody(c, logs, acts) {
    var issues = A.issuesOf(c);
    var amount = A.amountOf(c);
    var prog = A.progressOf(c);
    var meetings = Number(c.meetings) || 0;
    var calls = Number(c.calls) || 0;

    var amountSub = issues.length
      ? '이슈 ' + issues.length + '건 합산'
      : '이슈를 선택하면 자동 계산됩니다';

    var html = '';

    html += '<div class="detail-top">'
      + '<div class="dt-box amount"><div class="dt-label">예상 계약금액</div>'
      + '<div class="dt-value">' + A.won(amount) + '</div>'
      + '<div class="dt-sub">' + amountSub + '</div></div>'
      + '<div class="dt-box"><div class="dt-prog-head"><span class="dt-label">진행률</span><strong>' + prog + '%</strong></div>'
      + '<div class="bar"><i class="' + (prog >= 100 ? 'ok' : '') + '" style="width:' + prog + '%"></i></div>'
      + '<div class="dt-sub">미팅 ' + meetings + ' / 7건 (' + A.pct(meetings, 7) + '%) · 전화 ' + calls + '건</div></div>'
      + '</div>';

    html += '<div class="chips" style="margin-bottom:4px">' + A.issueChips(issues) + '</div>';

    html += '<dl class="dl">'
      + '<div><dt>지역</dt><dd>' + A.esc(c.region || '-') + '</dd></div>'
      + '<div><dt>대표이사</dt><dd>' + A.esc(c.ceo || '-') + '</dd></div>'
      + '<div><dt>연락처</dt><dd>' + A.esc(c.phone || '-') + '</dd></div>'
      + '<div><dt>등록일</dt><dd>' + A.fmtDate(c.created_at) + '</dd></div>'
      + '<div style="grid-column:1/-1"><dt>주소</dt><dd>' + A.esc(c.address || '-') + '</dd></div>'
      + (c.memo ? '<div style="grid-column:1/-1"><dt>메모</dt><dd>' + A.esc(c.memo) + '</dd></div>' : '')
      + '</dl>';

    html += '<div class="mini-title">미팅 · 전화 기록 <span class="count-pill">' + acts.length + '</span></div>'
      + '<form class="inline-form" id="act-form">'
      + '<select class="select" name="act_type"><option value="meeting">미팅</option><option value="call">전화</option></select>'
      + '<input type="date" class="input" name="act_date" value="' + A.todayISO() + '">'
      + '<input class="input" name="content" placeholder="내용 (예: 대표님 미팅, 특허 2건 논의)" maxlength="200">'
      + '<button class="btn btn-primary" type="submit">추가</button>'
      + '</form>'
      + '<ul class="mini-list">'
      + (acts.length ? acts.slice(0, 20).map(function (a) {
        return '<li class="mini-item">'
          + '<span class="mi-type ' + (a.act_type === 'meeting' ? 'meeting' : 'call') + '">' + (a.act_type === 'meeting' ? '미팅' : '전화') + '</span>'
          + '<span class="mi-txt">' + A.esc(a.content || '(내용 없음)') + '</span>'
          + '<span class="mi-date">' + A.fmtDate(a.act_date) + '</span>'
          + '<button class="icon-btn tiny" data-act-del="' + a.id + '" aria-label="삭제">✕</button>'
          + '</li>';
      }).join('') : '<li class="day-empty">아직 기록이 없습니다. 미팅·전화를 추가해 보세요.</li>')
      + '</ul>';

    html += '<div class="mini-title">진행사항 <span class="count-pill">' + logs.length + '</span>'
      + '<span class="muted" style="font-weight:500">한 줄 기록 · (+)로 계속 누적</span></div>'
      + '<form class="inline-form" id="log-form">'
      + '<input type="date" class="input" name="log_date" value="' + A.todayISO() + '">'
      + '<input class="input" name="content" placeholder="오늘 진행한 내용을 한 줄로 기록" maxlength="300">'
      + '<button class="btn btn-primary" type="submit">+ 추가</button>'
      + '</form>'
      + '<ul class="timeline" id="log-timeline">'
      + (logs.length ? logs.map(function (l) {
        return '<li class="tl-item">'
          + '<span class="tl-dot"></span>'
          + '<div class="tl-body"><div class="tl-meta">' + A.fmtDate(l.log_date) + '</div>'
          + '<div class="tl-text">' + A.esc(l.content) + '</div></div>'
          + '<button class="icon-btn tiny" data-log-del="' + l.id + '" aria-label="삭제">✕</button>'
          + '</li>';
      }).join('') : '<li class="day-empty">아직 진행사항이 없습니다. 첫 기록을 남겨 보세요.</li>')
      + '</ul>';

    return html;
  }

  function footerHtml() {
    return '<button class="btn btn-danger" data-del-company>삭제</button>'
      + '<div class="spacer"></div>'
      + '<button class="btn" data-edit-company>수정</button>'
      + '<button class="btn btn-primary" data-close>닫기</button>';
  }

  A.bindCompanyDetail = function (m, c) {
    m.onclick = function (e) {
      if (e.target.closest('[data-edit-company]')) {
        A.closeModal();
        A.openCompanyForm(c);
        return;
      }
      if (e.target.closest('[data-del-company]')) {
        A.confirm('"' + c.name + '" 업체와 모든 기록을 삭제할까요?').then(async function (ok) {
          if (!ok) return;
          try {
            await A.q('delete_company', { id: c.id });
            A.closeModal();
            A.toast('업체를 삭제했습니다');
            await A.refresh();
          } catch (err) { console.error('[error]', err); A.toast('삭제하지 못했습니다', 'danger'); }
        });
        return;
      }
      var ldel = e.target.closest('[data-log-del]');
      if (ldel) {
        A.q('delete_log', { id: Number(ldel.getAttribute('data-log-del')) }).then(async function () {
          await A.loadAll(); A.render(); await refreshDetail(m, c.id);
        }).catch(function (err) { console.error('[error]', err); A.toast('삭제하지 못했습니다', 'danger'); });
        return;
      }
      var adel = e.target.closest('[data-act-del]');
      if (adel) {
        A.q('delete_activity', { id: Number(adel.getAttribute('data-act-del')) }).then(async function () {
          await A.loadAll(); A.render(); await refreshDetail(m, c.id);
        }).catch(function (err) { console.error('[error]', err); A.toast('삭제하지 못했습니다', 'danger'); });
      }
    };

    m.onsubmit = async function (e) {
      e.preventDefault();
      var f = e.target;
      if (f.id === 'act-form') {
        var content = f.querySelector('[name=content]').value.trim();
        try {
          await A.q('insert_activity', {
            company_id: c.id,
            act_type: f.querySelector('[name=act_type]').value,
            act_date: f.querySelector('[name=act_date]').value || A.todayISO(),
            content: content || null
          });
          A.toast('기록을 추가했습니다');
          await A.loadAll(); A.render(); await refreshDetail(m, c.id);
        } catch (err) { console.error('[error]', err); A.toast('추가하지 못했습니다', 'danger'); }
        return;
      }
      if (f.id === 'log-form') {
        var text = f.querySelector('[name=content]').value.trim();
        if (!text) { A.toast('진행 내용을 입력하세요', 'warn'); return; }
        try {
          await A.q('insert_log', {
            company_id: c.id,
            log_date: f.querySelector('[name=log_date]').value || A.todayISO(),
            content: text
          });
          A.toast('진행사항을 기록했습니다');
          await A.loadAll(); A.render(); await refreshDetail(m, c.id);
        } catch (err) { console.error('[error]', err); A.toast('저장하지 못했습니다', 'danger'); }
      }
    };
  };

  async function refreshDetail(m, id) {
    if (!document.body.contains(m)) return;
    var res = await Promise.all([
      A.q('load_company', { id: id }),
      A.q('load_company_logs', { company_id: id }),
      A.q('load_company_activities', { company_id: id })
    ]);
    var c = res[0].rows[0];
    if (!c) { A.closeModal(); return; }
    var bodyEl = m.querySelector('.modal-body');
    bodyEl.innerHTML = detailBody(c, res[1].rows, res[2].rows);
    var titleEl = m.querySelector('.modal-title');
    if (titleEl) titleEl.textContent = c.name;
    A.bindCompanyDetail(m, c);
    var tl = m.querySelector('#log-timeline');
    if (tl) tl.scrollTop = tl.scrollHeight;
  }

  A.openCompanyDetail = async function (id) {
    console.log('[render] company', id);
    var res;
    try {
      res = await Promise.all([
        A.q('load_company', { id: id }),
        A.q('load_company_logs', { company_id: id }),
        A.q('load_company_activities', { company_id: id })
      ]);
    } catch (err) {
      console.error('[error]', err);
      A.toast('업체 정보를 불러오지 못했습니다', 'danger');
      return;
    }
    var c = res[0].rows[0];
    if (!c) { A.toast('업체를 찾을 수 없습니다', 'danger'); return; }

    var m = A.openModal({
      title: c.name,

      + '</div></div>'

      + '<label class="up-drop" id="up-drop">'

      + '<span class="up-txt"><b>파일 선택</b> 또는 여기로 끌어다 놓기'
      + '<span class="up-sub">PDF · 이미지 · 엑셀 · PPT · 한글 · 텍스트</span></span>'
      + '</label></div>'
      + '<div class="up-status" id="up-status" hidden></div>'
      + '<div class="file-list">' + fileRows + '</div>'
      + '</div></section>';

    html += '<section class="card">'
      + '<div class="card-head"><div>'
      + '<div class="card-title">이슈별 계약 예상금액</div>'
      + '<div class="card-sub">업체에 이슈를 여러 개 선택하면 건별 금액이 자동으로 합산됩니다</div>'

      + '<div class="table-wrap"><table class="tbl issue-tbl">'

    html += '<section class="card">'

      + '<div class="fc-op">×</div>'
      + '<div class="fc-box"><div class="fc-num"><em>7</em></div><div class="fc-label">미팅</div></div>'
      + '<div class="fc-op">=</div>'
      + '<div class="fc-box"><div class="fc-num">1</div><div class="fc-label">계약 기회</div></div>'
      + '</div>'
      + '<div class="card-body" style="padding-top:0">'
      + '<div class="hero-pills">'
      + '<span class="hero-pill">등록 업체 <strong>' + companyCount + '곳</strong></span>'
      + '<span class="hero-pill">목표 미팅 <strong>' + (companyCount * 7) + '건</strong></span>'
      + '<span class="hero-pill">누적 미팅 <strong>' + meetings + '건</strong></span>'
      + '<span class="hero-pill">누적 전화 <strong>' + calls + '건</strong></span>'
      + '</div>'
      + '<p class="muted" style="margin-top:10px;line-height:1.7">전화는 매일 1건 이상 — 하루 한 통의 미팅 약속 전화가 7건의 미팅을 만들고, 7건의 미팅이 1건의 계약을 만듭니다.</p>'
      + '</div></section>';

    html += '<section class="card">'
      + '<div class="card-head"><div>'
      + '<div class="card-title">스크립트 · 자료 <span class="count-pill">' + A.state.resources.length + '</span></div>'
      + '<div class="card-sub">첫 전화 · 미팅 상담 · 후속 연락 · 반론 대응 — 직접 수정하거나 새 자료를 추가하세요</div>'
      + '</div><button class="btn btn-primary" data-add-doc>+ 자료 추가</button></div>'
      + '<div class="card-body"><div class="doc-grid">'
      + A.state.resources.map(function (r) {
        return '<article class="doc">'
          + '<div class="doc-head"><span class="doc-cat">' + A.esc(r.category || '자료') + '</span>'
          + '<div class="doc-actions">'

          + '<button class="icon-btn tiny" data-del-doc="' + r.id + '" aria-label="삭제">✕</button>'

      + '</div></div></section>';

    body.innerHTML = html;
    bindResources(body);

  var MAX_FILE = 4 * 1024 * 1024;

  function readAsDataUrl(file, onProgress) {
    return new Promise(function (resolve, reject) {
      var fr = new FileReader();
      fr.onprogress = function (ev) {
        if (ev.lengthComputable && onProgress) onProgress(Math.round((ev.loaded / ev.total) * 100));
      };
      fr.onload = function () { resolve(fr.result); };
      fr.onerror = function () { reject(fr.error || new Error('파일을 읽지 못했습니다')); };
      fr.readAsDataURL(file);
    });
  }

  async function downloadFile(id) {
    try {
      var res = await A.q('get_resource_file', { id: id });
      var f = res.rows && res.rows[0];
      if (!f) { A.toast('자료를 찾을 수 없습니다', 'danger'); return; }
      A.saveBlob(A.dataUrlToBlob(f.data_url), f.file_name || 'download');
      A.toast('다운로드를 시작했습니다');
    } catch (err) {
      console.error('[download]', err);
      A.toast('다운로드하지 못했습니다', 'danger');
    }
  }

  async function uploadFiles(files) {
    var catEl = document.getElementById('up-cat');
    var cat = (catEl && catEl.value.trim()) || '자료';
    var statusEl = document.getElementById('up-status');
    if (statusEl) { statusEl.hidden = false; statusEl.innerHTML = ''; }
    var ok = 0;
    var skipped = 0;
    for (var i = 0; i < files.length; i++) {
      var f = files[i];
      if (f.size > MAX_FILE) { skipped++; continue; }
      var row = document.createElement('div');
      row.className = 'up-item';
      row.innerHTML = '<span class="up-name">' + A.esc(f.name) + '</span>'
        + '<span class="up-pct">0%</span>'
        + '<span class="up-bar"><i></i></span>';
      if (statusEl) statusEl.appendChild(row);
      try {
        var dataUrl = await readAsDataUrl(f, function (p) {
          var pc = row.querySelector('.up-pct');
          var bar = row.querySelector('.up-bar i');
          if (pc) pc.textContent = p + '%';
          if (bar) bar.style.width = p + '%';
        });
        var pc2 = row.querySelector('.up-pct');
        if (pc2) pc2.textContent = '저장 중…';
        await A.q('insert_resource_file', {
          title: (f.name.replace(/\.[^.]+$/, '') || f.name).slice(0, 120),
          category: cat,
          file_name: f.name,
          mime_type: f.type || A.guessMime(f.name),
          file_size: f.size,
          data_url: dataUrl,
          note: null
        });
        row.className = 'up-item done';
        var pc3 = row.querySelector('.up-pct');
        if (pc3) pc3.textContent = '완료';
        ok++;
      } catch (err) {
        console.error('[upload]', err);
        row.className = 'up-item fail';
        var pc4 = row.querySelector('.up-pct');
        if (pc4) pc4.textContent = '실패';
        A.toast(f.name + ' — 올리지 못했습니다. 파일 크기를 줄이거나 잠시 후 다시 시도해 주세요', 'danger');
      }
    }
    if (skipped) A.toast(skipped + '개 파일이 4MB를 넘어 건너뛰었습니다', 'warn');
    if (ok) {
      A.toast(ok + '개 자료를 올렸습니다');
      await A.refresh();
    } else if (!skipped) {
      A.toast('자료를 올리지 못했습니다', 'danger');
    }
  }

  function bindResources(body) {
    body.onclick = function (e) {
      if (e.target.closest('[data-add-doc]')) { A.openDocForm(null); return; }

      var view = e.target.closest('[data-view-file]');
      if (view) { A.openResourceFile(Number(view.getAttribute('data-view-file'))); return; }

      var dl = e.target.closest('[data-dl-file]');
      if (dl) { downloadFile(Number(dl.getAttribute('data-dl-file'))); return; }

      var ed = e.target.closest('[data-edit-file]');
      if (ed) {
        var fid = Number(ed.getAttribute('data-edit-file'));
        var ff = (A.state.resourceFiles || []).filter(function (x) { return x.id === fid; })[0];
        if (ff) A.openFileMeta(ff);
        return;
      }

      var df = e.target.closest('[data-del-file]');
      if (df) {
        var delId = Number(df.getAttribute('data-del-file'));
        var target = (A.state.resourceFiles || []).filter(function (x) { return x.id === delId; })[0];
        if (!target) return;
        A.confirm('"' + (target.title || target.file_name) + '" 자료를 삭제할까요?').then(async function (ok) {
          if (!ok) return;
          try {
            await A.q('delete_resource_file', { id: delId });
            A.toast('자료를 삭제했습니다');
            await A.refresh();
          } catch (err) { console.error('[error]', err); A.toast('삭제하지 못했습니다', 'danger'); }
        });
        return;
      }

      var edit = e.target.closest('[data-edit-doc]');
      if (edit) {
        var id = Number(edit.getAttribute('data-edit-doc'));
        var r = A.state.resources.filter(function (x) { return x.id === id; })[0];
        if (r) A.openDocForm(r);
        return;
      }
      var del = e.target.closest('[data-del-doc]');
      if (del) {
        var did = Number(del.getAttribute('data-del-doc'));
        var dr = A.state.resources.filter(function (x) { return x.id === did; })[0];
        if (!dr) return;
        A.confirm('"' + dr.title + '" 자료를 삭제할까요?').then(async function (ok) {
          if (!ok) return;
          try {
            await A.q('delete_resource', { id: did });
            A.toast('자료를 삭제했습니다');
            await A.refresh();
          } catch (err) { console.error('[error]', err); A.toast('삭제하지 못했습니다', 'danger'); }
        });
      }
    };

    body.onchange = function (e) {
      if (e.target && e.target.id === 'up-input') {
        var picked = Array.prototype.slice.call(e.target.files || []);
        e.target.value = '';
        if (picked.length) uploadFiles(picked);
      }
    };
    body.oninput = null;

    var drop = body.querySelector('#up-drop');
    if (drop) {
      drop.addEventListener('dragover', function (e) {
        e.preventDefault();
        drop.classList.add('dragging');
      });
      drop.addEventListener('dragleave', function () {
        drop.classList.remove('dragging');
      });
      drop.addEventListener('drop', function (e) {
        e.preventDefault();
        drop.classList.remove('dragging');
        var dropped = Array.prototype.slice.call((e.dataTransfer && e.dataTransfer.files) || []);
        if (dropped.length) uploadFiles(dropped);
      });
    }
  }

  A.openDocForm = function (resource) {
    var edit = !!resource;
    var cats = [];
    A.state.resources.forEach(function (r) {
      if (r.category && cats.indexOf(r.category) < 0) cats.push(r.category);
    });

    var body = '<form id="doc-form" class="form-grid" autocomplete="off">'
      + '<div class="field full"><label>분류</label>'
      + '<input class="input" name="category" list="doc-cats" maxlength="40" placeholder="예) 전화 스크립트" value="' + A.esc(resource ? resource.category : '') + '">'
      + '<datalist id="doc-cats">' + cats.map(function (c) { return '<option value="' + A.esc(c) + '">'; }).join('') + '</datalist></div>'
      + '<div class="field full"><label>제목 <span class="req">*</span></label>'
      + '<input class="input" name="title" maxlength="120" placeholder="예) 첫 전화 · 미팅 약속 스크립트" value="' + A.esc(resource ? resource.title : '') + '"></div>'
      + '<div class="field full"><label>내용</label>'
      + '<textarea class="textarea" name="body" rows="18" placeholder="스크립트나 참고 내용을 자유롭게 작성하세요">' + A.esc(resource ? resource.body : '') + '</textarea></div>'
      + '</form>';

    var footer = '<button class="btn" data-close>취소</button>'
      + '<button class="btn btn-primary" id="doc-save">' + (edit ? '수정 저장' : '자료 추가') + '</button>';

    var m = A.openModal({
      title: edit ? '자료 수정' : '자료 추가',
      sub: '스크립트 · 화법 · 참고자료',
      body: body,
      footer: footer,
      wide: true
    });

    var saveBtn = m.querySelector('#doc-save');
    m.querySelector('#doc-form').onsubmit = function (e) {
      e.preventDefault();
      saveBtn.click();
    };
    saveBtn.onclick = async function () {
      var f = m.querySelector('#doc-form');
      var payload = {
        category: f.querySelector('[name=category]').value.trim() || '자료',
        title: f.querySelector('[name=title]').value.trim(),
        body: f.querySelector('[name=body]').value
      };
      if (!payload.title) {
        A.toast('제목을 입력하세요', 'warn');
        f.querySelector('[name=title]').focus();
        return;
      }
      saveBtn.disabled = true;
      try {
        if (edit) {
          payload.id = resource.id;
          await A.q('update_resource', payload);
        } else {
          await A.q('insert_resource', payload);
        }
        A.closeModal();
        A.toast(edit ? '자료를 수정했습니다' : '자료를 추가했습니다');
        await A.refresh();
      } catch (err) {
        console.error('[error]', err);
        saveBtn.disabled = false;
        A.toast('저장하지 못했습니다', 'danger');
      }
    };

    var titleInput = m.querySelector('[name=title]');
    if (titleInput) titleInput.focus();
  };
})();

</script>
